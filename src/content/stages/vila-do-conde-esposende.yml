i18n:
  en:
    metaTitle: "Vila do Conde to Esposende (23.7 km): Coastal Camino Stage 2 (2026)"
    metaDescription: "Stage 2 of the Camino Portugués Coastal: 23.7 km of Atlantic boardwalk from Vila do Conde through Póvoa de Varzim, Apúlia and Fão to Esposende. Distance, terrain, landmarks and what the town offers pilgrims."
    h1: "Vila do Conde to Esposende"
    lead: "The easiest day of the whole Coastal route and, for a lot of people, the one they remember. 23.7 km with only 167 m of climbing, most of it on wooden boardwalk with the Atlantic on your left the entire way."
    sections:
      - heading: "Distance and difficulty"
        body: "23.7 km and 167 m of ascent — effectively flat. Five to six hours at a normal pace. There is no climb worth the name and no navigational puzzle: the sea stays on your left and the boardwalk does the work. The only thing that bites is cobbles through the towns, and the fact that a flat day on hard surfaces still tires legs by hour five."
      - heading: "The stage, section by section"
        body: "Vila do Conde and the Igreja Matriz de São João Baptista → Póvoa de Varzim, a full-size seaside resort with wide boulevards and cafés → Aguçadoura, a low-key surf village → Apúlia, known for the seaweed-harvesting sheds and a good lunch stop → Fão and the Igreja do Senhor Bom Jesus → the metal bridge over the Rio Cávado → Esposende."
      - heading: "Boardwalk all the way"
        body: "💡 This is the stage that sells the Coastal route. Long stretches of raised timber walkway run over the dunes between the towns, with the ocean open beside you and beach bars every few kilometres in season. It is soft underfoot compared to what came before, exposed to wind, and there is very little shade — sun protection matters more here than grip."
      - heading: "Póvoa de Varzim: stop or push on?"
        body: "Póvoa arrives after about 5 km and it is tempting, especially if you split the first stage and arrived in Vila do Conde late. It has everything — hotels, restaurants, a casino, a beach. But it is early in the day and Esposende is a nicer place to finish. Push on unless you are deliberately walking short days."
      - heading: "Arriving in Esposende"
        body: "You cross the Cávado on the metal bridge at Fão and Esposende opens up on the far bank. The town has two large supermarkets, plenty of restaurants and bars, and a range of pilgrim accommodation. It is a windsurf and kitesurf town, so the seafront has more life than its size suggests, and the 15th-century Forte de São João Baptista guards the river mouth with views along the coast."
    faq:
      - q: "How long is Vila do Conde to Esposende?"
        a: "23.7 km with about 167 m of ascent, usually five to six hours. It is the flattest and easiest stage of the Portuguese Coastal route."
      - q: "Is this stage really all boardwalk?"
        a: "Not all, but most. Long raised timber walkways run over the dunes between the towns, with cobbled streets through Póvoa de Varzim, Apúlia and Fão. The Atlantic is beside you for almost the entire day."
      - q: "Where should I stop for lunch?"
        a: "Póvoa de Varzim at about 5 km if you want a proper town, or Apúlia around the halfway mark, which is the more natural lunch stop and has cafés on the route. Beach bars along the boardwalk open in season."
      - q: "What does Esposende have for pilgrims?"
        a: "Two large supermarkets, a good spread of restaurants and bars, and several accommodation options including hostels and guesthouses. It is also a windsurf and kitesurf town, so the seafront stays busy, and the 15th-century Forte de São João Baptista is worth the short walk."
      - q: "Is there shade on this stage?"
        a: "Very little. The boardwalks run over open dunes with the sea on one side and nothing overhead. In summer this is a hat, sunscreen and extra-water day, and the Atlantic wind can mask how much sun you are getting."
