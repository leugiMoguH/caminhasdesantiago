  pt:
    metaTitle: "Vila do Conde a Esposende (23,7 km): Caminho da Costa etapa 2 (2026)"
    metaDescription: "Etapa 2 do Caminho Português da Costa: 23,7 km de passadiço atlântico de Vila do Conde pela Póvoa de Varzim, Apúlia e Fão até Esposende. Distância, terreno, pontos de interesse e o que a vila oferece ao peregrino."
    h1: "De Vila do Conde a Esposende"
    lead: "O dia mais fácil de todo o Caminho da Costa e, para muita gente, o que fica na memória. 23,7 km com apenas 167 m de subida, quase tudo sobre passadiço de madeira com o Atlântico à esquerda do princípio ao fim."
    sections:
      - heading: "Distância e dificuldade"
        body: "23,7 km e 167 m de subida acumulada — praticamente plano. Cinco a seis horas a ritmo normal. Não há uma única subida digna desse nome nem problema de orientação: o mar fica à esquerda e o passadiço faz o trabalho. O que incomoda é a calçada nas vilas e o facto de um dia plano em piso duro também cansar a partir da quinta hora."
      - heading: "A etapa, troço a troço"
        body: "Vila do Conde e a Igreja Matriz de São João Baptista → Póvoa de Varzim, uma estância balnear a sério com avenidas largas e cafés → Aguçadoura, aldeia de surf sossegada → Apúlia, conhecida pelos armazéns da apanha do sargaço e boa paragem para almoço → Fão e a Igreja do Senhor Bom Jesus → a ponte metálica sobre o Rio Cávado → Esposende."
      - heading: "Passadiço quase todo o dia"
        body: "💡 Esta é a etapa que vende o Caminho da Costa. Longos troços de passadiço elevado de madeira atravessam as dunas entre as vilas, com o oceano aberto ao lado e bares de praia de poucos em poucos quilómetros na época. É macio comparado com o que veio antes, exposto ao vento e quase sem sombra — aqui a proteção solar conta mais do que a aderência."
      - heading: "Póvoa de Varzim: parar ou seguir?"
        body: "A Póvoa aparece ao fim de uns 5 km e é tentadora, sobretudo se partiste a primeira etapa e chegaste tarde a Vila do Conde. Tem tudo: hotéis, restaurantes, casino, praia. Mas é cedo de mais e Esposende é melhor sítio para acabar. Segue, a não ser que estejas a fazer etapas curtas de propósito."
      - heading: "Chegada a Esposende"
        body: "Atravessas o Cávado pela ponte metálica de Fão e Esposende abre-se na outra margem. A vila tem dois supermercados grandes, restaurantes e bares com fartura e várias opções de alojamento para peregrinos. É terra de windsurf e kitesurf, por isso a marginal tem mais vida do que o tamanho faz supor, e o Forte de São João Baptista, do século XV, guarda a foz com vistas ao longo da costa."
    faq:
      - q: "Qual é a distância de Vila do Conde a Esposende?"
        a: "23,7 km com cerca de 167 m de subida acumulada, normalmente cinco a seis horas. É a etapa mais plana e fácil do Caminho Português da Costa."
      - q: "É mesmo tudo passadiço?"
        a: "Tudo não, mas quase. Longos troços de passadiço elevado de madeira atravessam as dunas entre as vilas, com calçada nas ruas da Póvoa de Varzim, Apúlia e Fão. O Atlântico acompanha-te quase o dia inteiro."
      - q: "Onde devo parar para almoçar?"
        a: "Na Póvoa de Varzim por volta do km 5 se quiseres uma vila grande, ou em Apúlia a meio, que é a paragem natural e tem cafés em cima do trilho. Os bares de praia do passadiço abrem na época."
      - q: "O que tem Esposende para o peregrino?"
        a: "Dois supermercados grandes, boa oferta de restaurantes e bares e várias opções de alojamento, incluindo hostels e pensões. É também terra de windsurf e kitesurf, por isso a marginal mantém-se animada, e o Forte de São João Baptista do século XV vale o pequeno desvio."
      - q: "Há sombra nesta etapa?"
        a: "Muito pouca. Os passadiços atravessam dunas abertas com o mar de um lado e nada por cima. No verão é dia de chapéu, protetor solar e água a mais, e o vento atlântico disfarça o sol que estás a apanhar."
