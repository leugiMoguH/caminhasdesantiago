  es:
    metaTitle: "Vila do Conde a Esposende (23,7 km): Camino de la Costa etapa 2 (2026)"
    metaDescription: "Etapa 2 del Camino Portugués de la Costa: 23,7 km de pasarela atlántica desde Vila do Conde por Póvoa de Varzim, Apúlia y Fão hasta Esposende. Distancia, terreno, puntos de interés y qué ofrece el pueblo al peregrino."
    h1: "De Vila do Conde a Esposende"
    lead: "El día más fácil de toda la ruta de la Costa y, para mucha gente, el que recuerdan. 23,7 km con solo 167 m de desnivel, casi todo sobre pasarela de madera con el Atlántico a la izquierda de principio a fin."
    sections:
      - heading: "Distancia y dificultad"
        body: "23,7 km y 167 m de desnivel positivo — prácticamente llano. Cinco o seis horas a ritmo normal. No hay ninguna subida digna de mención ni problema de orientación: el mar se queda a la izquierda y la pasarela hace el trabajo. Lo único que molesta son los adoquines de los pueblos y que un día llano sobre superficie dura también cansa a partir de la quinta hora."
      - heading: "La etapa, tramo a tramo"
        body: "Vila do Conde y la Igreja Matriz de São João Baptista → Póvoa de Varzim, un balneario en toda regla con bulevares y cafés → Aguçadoura, pueblo surfero tranquilo → Apúlia, conocida por los almacenes de recogida de algas y buena parada para comer → Fão y la Igreja do Senhor Bom Jesus → el puente metálico sobre el Rio Cávado → Esposende."
      - heading: "Pasarela casi todo el día"
        body: "💡 Esta es la etapa que vende la ruta de la Costa. Largos tramos de pasarela elevada de madera cruzan las dunas entre los pueblos, con el océano abierto al lado y chiringuitos cada pocos kilómetros en temporada. Es blanda comparada con lo anterior, está expuesta al viento y apenas hay sombra — aquí importa más la protección solar que el agarre."
      - heading: "Póvoa de Varzim: ¿parar o seguir?"
        body: "Póvoa aparece a unos 5 km y tienta, sobre todo si partiste la primera etapa y llegaste tarde a Vila do Conde. Lo tiene todo: hoteles, restaurantes, casino, playa. Pero es muy pronto y Esposende es mejor sitio para terminar. Sigue, salvo que estés haciendo etapas cortas a propósito."
      - heading: "Llegada a Esposende"
        body: "Cruzas el Cávado por el puente metálico de Fão y Esposende se abre en la otra orilla. El pueblo tiene dos supermercados grandes, restaurantes y bares de sobra y varias opciones de alojamiento para peregrinos. Es una localidad de windsurf y kitesurf, así que el paseo marítimo tiene más vida de la que su tamaño sugiere, y el Forte de São João Baptista, del siglo XV, vigila la desembocadura con vistas a lo largo de la costa."
    faq:
      - q: "¿Cuánto hay de Vila do Conde a Esposende?"
        a: "23,7 km con unos 167 m de desnivel positivo, normalmente entre cinco y seis horas. Es la etapa más llana y fácil del Camino Portugués de la Costa."
      - q: "¿De verdad es todo pasarela?"
        a: "Todo no, pero casi. Largos tramos de pasarela elevada de madera cruzan las dunas entre los pueblos, con calles adoquinadas en Póvoa de Varzim, Apúlia y Fão. El Atlántico te acompaña casi toda la jornada."
      - q: "¿Dónde conviene parar a comer?"
        a: "En Póvoa de Varzim hacia el km 5 si quieres un pueblo grande, o en Apúlia sobre la mitad, que es la parada natural y tiene cafés en ruta. Los chiringuitos de la pasarela abren en temporada."
      - q: "¿Qué ofrece Esposende al peregrino?"
        a: "Dos supermercados grandes, buena oferta de restaurantes y bares y varias opciones de alojamiento, entre ellas hostels y pensiones. Además es localidad de windsurf y kitesurf, así que el paseo marítimo está animado, y el Forte de São João Baptista del siglo XV merece el pequeño rodeo."
      - q: "¿Hay sombra en esta etapa?"
        a: "Muy poca. Las pasarelas cruzan dunas abiertas con el mar a un lado y nada por encima. En verano es día de gorra, protector solar y agua de más, y el viento atlántico disimula el sol que estás recibiendo."
