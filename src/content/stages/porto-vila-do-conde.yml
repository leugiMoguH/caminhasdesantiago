  es:
    metaTitle: "Oporto a Vila do Conde (28,4 km): Camino de la Costa etapa 1 (2026)"
    metaDescription: "La primera etapa del Camino Portugués de la Costa: 28,4 km de la Catedral de Oporto a Vila do Conde. Cómo salir de la ciudad, si tomar el metro a Matosinhos, las pasarelas de la Senda Litoral y dónde partir la jornada."
    h1: "De Oporto a Vila do Conde"
    lead: "La jornada más larga de la ruta de la Costa y la que más gente planifica mal. 28,4 km desde la Sé do Porto hasta Vila do Conde, con 354 m de desnivel muy repartido — la dificultad no son las cuestas, son los adoquines y las dos horas de ciudad hasta llegar a costa abierta."
    sections:
      - heading: "Dónde empieza realmente el Camino"
        body: "El punto de partida oficial es la Sé do Porto, la catedral sobre la estación de São Bento. Sella allí tu credencial por primera vez — la catedral sella a los peregrinos y es el sello que todo el mundo quiere al principio. Desde la Sé las flechas suben hacia el norte por el casco antiguo; en el Cruzeiro do Senhor se separan la ruta de la Costa y la Central, y a partir de ahí las flechas son tuyas."
      - heading: "La salida de Oporto: ¿andarla o saltarla?"
        body: "⚠️ La versión honesta: los primeros 10 km de Oporto son extrarradio — acera, semáforos, polígonos y adoquines que castigan los pies el primer día. Muchos peregrinos toman el metro o un autobús hasta el límite de la ciudad y empiezan a caminar allí; otros los hacen enteros por principio. Ninguna opción está mal y en la Oficina del Peregrino nadie pregunta. Si vas a pedir la Compostela, recuerda que la distancia que cuenta se mide en España, así que saltarte el extrarradio no te quita nada."
      - heading: "Senda Litoral: la alternativa por las pasarelas"
        body: "💡 La mayoría de peregrinos no sigue las flechas oficiales de la Costa al salir de Oporto: van por la Senda Litoral, la pasarela de madera que recorre el Atlántico desde Matosinhos hacia el norte. Es técnicamente una variante y no la ruta oficial, y es algo más larga, pero cambia el corredor industrial por mar, dunas y chiringuitos. Las dos líneas se reencuentran más al norte. Si puedes elegir, la pasarela es el mejor primer día."
      - heading: "La etapa, tramo a tramo"
        body: "Sé do Porto → Cruzeiro do Senhor (bifurcación) → Monte dos Burgos → el corredor del aeropuerto → campo abierto → Vila do Conde Retail Park → el puente sobre el Rio Ave → el Convento de Santa Clara y su acueducto a la derecha → casco antiguo de Vila do Conde. Por la Senda Litoral cambias el tramo central por Matosinhos, Leça, Vila Chã y Árvore, casi siempre junto al mar."
      - heading: "Dónde partir la jornada"
        body: "28,4 km son muchos para un primer día con pies sin rodar. Las paradas intermedias habituales son Matosinhos (a un metro de Oporto, ideal para empezar suave), Vila Chã, a unos 25 minutos fuera de ruta y con un albergue muy valorado, y Árvore, cerca de una conexión de metro. Partirla convierte un primer día duro en dos fáciles y no te cuesta nada de calendario si tienes los días."
      - heading: "Llegada a Vila do Conde"
        body: "Cruzas el Rio Ave y el pueblo se presenta solo: el Convento de Santa Clara arriba a la derecha y, a su lado, el Acueducto de Santa Clara — una hilera de arcos del siglo XVII que llevaba agua unos cuatro kilómetros hasta el convento. Abajo, el casco antiguo tiene supermercados, restaurantes, albergue de peregrinos y playa. Es un sitio para quedarse, no solo una cama al final de una paliza."
    faq:
      - q: "¿Cuánto hay de Oporto a Vila do Conde?"
        a: "28,4 km con unos 354 m de desnivel positivo, normalmente entre seis y siete horas. Es la etapa más larga del Camino Portugués de la Costa y el desnivel está muy repartido, así que la dificultad viene de la distancia y los adoquines, no de las subidas."
      - q: "¿Debo tomar el metro para salir de Oporto?"
        a: "Es una opción habitual y perfectamente aceptada. Los primeros 10 km son extrarradio sobre pavimento duro, y muchos peregrinos van en metro hasta Matosinhos y empiezan a caminar desde la costa. Nadie lo comprueba y no afecta a tu Compostela, porque la distancia que cuenta se mide en España."
      - q: "¿Qué diferencia hay entre la ruta de la Costa y la Senda Litoral?"
        a: "La ruta de la Costa es el trazado señalizado oficial; la Senda Litoral es la variante de pasarelas que va pegada al Atlántico desde Matosinhos hacia el norte. La Litoral es algo más larga y mucho más bonita, y ambas se reencuentran más al norte. Casi todos los peregrinos usan las pasarelas al menos parte de los primeros días."
      - q: "¿Dónde puedo partir la etapa de Oporto a Vila do Conde?"
        a: "En Matosinhos, Vila Chã o Árvore. Matosinhos está a un metro de Oporto y deja un primer día muy suave; Vila Chã queda a unos 25 minutos fuera de ruta con un albergue muy valorado; Árvore está cerca de una conexión de metro."
      - q: "¿Dónde sello la credencial por primera vez?"
        a: "En la Sé do Porto, la catedral donde arranca oficialmente la ruta. Desde 2025 necesitas dos sellos al día durante todo el camino, no solo en los últimos 100 km, así que empieza a reunirlos ya en Oporto."
      - q: "¿Es dura la primera etapa?"
        a: "Es larga más que empinada. Casi 30 km sobre adoquín y acera castigan unos pies que aún no han caminado, y por eso tantos peregrinos la parten o salen de la ciudad en transporte. Si la haces entera, madruga."
