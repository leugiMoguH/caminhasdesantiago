i18n:
  en:
    metaTitle: "Porto to Vila do Conde (28.4 km): Coastal Camino Stage 1 (2026)"
    metaDescription: "The first stage of the Camino Portugués Coastal: 28.4 km from Porto Cathedral to Vila do Conde. How to leave the city, whether to take the metro to Matosinhos, the Senda Litoral boardwalks, and where to break the day."
    h1: "Porto to Vila do Conde"
    lead: "The longest day on the Coastal route and the one people most often get wrong. 28.4 km from the Sé do Porto to Vila do Conde, with 354 m of climbing spread thin — the difficulty is not the hills, it is the cobbles and the two hours of city it takes to reach open coast."
    sections:
      - heading: "Where the Camino actually starts"
        body: "The official starting point is the Sé do Porto, the cathedral on the hill above São Bento station. Get your first credential stamp there — the cathedral stamps pilgrims and it is the one everybody wants at the front of the book. From the Sé the waymarks head north through the old streets; at the Cruzeiro do Senhor the Coastal and Central routes split, and from that point the arrows are yours."
      - heading: "The Porto exit: walk it or skip it?"
        body: "⚠️ The honest version: the first 10 km out of Porto are suburb — pavement, traffic lights, retail parks, and cobbles that punish feet on day one. Plenty of pilgrims ride the metro or a bus to the edge of the city and start walking there; plenty of others walk every metre on principle. Neither is wrong, and nobody at the Pilgrim's Office asks. If you plan to claim the Compostela, remember the distance that counts is measured in Spain, so skipping Porto suburbs costs you nothing."
      - heading: "Senda Litoral: the boardwalk alternative"
        body: "💡 Most pilgrims do not follow the official Coastal waymarks out of Porto at all — they walk the Senda Litoral, the wooden boardwalk that runs along the Atlantic from Matosinhos north. It is technically a variant rather than the official route, and it is slightly longer, but it trades the industrial corridor for sea, dunes and beach cafés. Both lines rejoin further north. If you have a choice, the boardwalk is the better first day."
      - heading: "The stage, section by section"
        body: "Sé do Porto → Cruzeiro do Senhor (route split) → Monte dos Burgos → the airport corridor → open country → Vila do Conde Retail Park → the bridge over the Rio Ave → the Convento de Santa Clara and its aqueduct on your right → Vila do Conde old town. On the Senda Litoral variant you swap the middle for Matosinhos, Leça, Vila Chã and Árvore, walking the coast almost the whole way."
      - heading: "Where to break the day"
        body: "28.4 km is a lot for a first day on unfamiliar feet. The usual half-way stops are Matosinhos (a short metro ride from Porto, ideal if you want a gentle start), Vila Chã, which sits about 25 minutes off the route and has a well-liked albergue, and Árvore, close to a metro connection. Splitting here turns a hard first day into two easy ones and costs you nothing on the calendar if you have the days."
      - heading: "Arriving in Vila do Conde"
        body: "You cross the Rio Ave and the town announces itself: the Convento de Santa Clara sits high on the right, and beside it the Aqueduto de Santa Clara — a 17th-century line of arches that carried water some four kilometres to the convent. The old town below has supermarkets, restaurants, a pilgrim albergue and a beach. It is a genuinely pleasant place to stop rather than just a bed at the end of a slog."
    faq:
      - q: "How long is Porto to Vila do Conde?"
        a: "28.4 km with about 354 m of ascent, usually walked in six to seven hours. It is the longest stage of the Portuguese Coastal route and the ascent is spread out, so the difficulty comes from distance and cobbles rather than climbing."
      - q: "Should I take the metro out of Porto?"
        a: "It is a common and perfectly accepted choice. The first 10 km are city suburb on hard pavement, and many pilgrims ride the metro to Matosinhos and start walking from the coast. Nobody checks, and it does not affect your Compostela, since the qualifying distance is counted in Spain."
      - q: "What is the difference between the Coastal route and the Senda Litoral?"
        a: "The Coastal route is the officially waymarked line; the Senda Litoral is the boardwalk variant that hugs the Atlantic from Matosinhos northwards. The Litoral is slightly longer and much more scenic, and the two rejoin further north. Most pilgrims use the boardwalks for at least part of the first days."
      - q: "Where can I break the Porto to Vila do Conde stage?"
        a: "Matosinhos, Vila Chã or Árvore. Matosinhos is a short metro ride from Porto and makes a very gentle first day; Vila Chã is about 25 minutes off the route with a well-regarded albergue; Árvore sits near a metro connection."
      - q: "Where do I get my first credential stamp?"
        a: "At the Sé do Porto, the cathedral where the route officially starts. Since 2025 you need two stamps a day for the whole walk, not just the last 100 km, so start collecting from Porto."
      - q: "Is the first day hard?"
        a: "It is long rather than steep. Nearly 30 km on cobbles and pavement is hard on feet that have not walked yet, which is why so many pilgrims either split it or ride out of the city. If you are walking it whole, start early."
