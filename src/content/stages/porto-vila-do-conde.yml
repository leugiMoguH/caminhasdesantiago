  pt:
    metaTitle: "Porto a Vila do Conde (28,4 km): Caminho da Costa etapa 1 (2026)"
    metaDescription: "A primeira etapa do Caminho Português da Costa: 28,4 km da Sé do Porto a Vila do Conde. Como sair da cidade, se deves apanhar o metro até Matosinhos, os passadiços da Senda Litoral e onde partir o dia."
    h1: "Do Porto a Vila do Conde"
    lead: "O dia mais longo do Caminho da Costa e aquele que mais gente planeia mal. 28,4 km da Sé do Porto até Vila do Conde, com 354 m de subida muito diluídos — a dificuldade não são as encostas, são as calçadas e as duas horas de cidade até chegares a costa aberta."
    sections:
      - heading: "Onde o Caminho começa mesmo"
        body: "O ponto de partida oficial é a Sé do Porto, a catedral acima da estação de São Bento. Carimba aí a credencial pela primeira vez — a Sé carimba peregrinos e é o carimbo que toda a gente quer no início. Da Sé as setas seguem para norte pelas ruas antigas; no Cruzeiro do Senhor separam-se o Caminho da Costa e o Central, e a partir daí as setas são tuas."
      - heading: "A saída do Porto: andar ou saltar?"
        body: "⚠️ A versão honesta: os primeiros 10 km do Porto são subúrbio — passeio, semáforos, parques comerciais e calçada que castiga pés no primeiro dia. Muitos peregrinos apanham o metro ou um autocarro até ao limite da cidade e começam a caminhar aí; outros fazem tudo a pé por princípio. Nenhuma opção está errada e ninguém pergunta na Oficina do Peregrino. Se vais pedir a Compostela, lembra-te de que a distância que conta é medida em Espanha, por isso saltar o subúrbio não te tira nada."
      - heading: "Senda Litoral: a alternativa pelos passadiços"
        body: "💡 A maioria dos peregrinos não segue as setas oficiais da Costa à saída do Porto — vai pela Senda Litoral, o passadiço de madeira que acompanha o Atlântico desde Matosinhos para norte. É tecnicamente uma variante e não a rota oficial, e é ligeiramente mais longa, mas troca o corredor industrial por mar, dunas e cafés de praia. As duas linhas voltam a juntar-se mais a norte. Se puderes escolher, o passadiço é o melhor primeiro dia."
      - heading: "A etapa, troço a troço"
        body: "Sé do Porto → Cruzeiro do Senhor (bifurcação) → Monte dos Burgos → o corredor do aeroporto → campo aberto → Vila do Conde Retail Park → a ponte sobre o Rio Ave → o Convento de Santa Clara e o seu aqueduto à direita → centro histórico de Vila do Conde. Pela Senda Litoral trocas o troço do meio por Matosinhos, Leça, Vila Chã e Árvore, quase sempre junto ao mar."
      - heading: "Onde partir o dia"
        body: "28,4 km é muito para um primeiro dia com pés por rodar. As paragens intermédias habituais são Matosinhos (a um metro do Porto, ideal para começar devagar), Vila Chã, a uns 25 minutos fora do trilho e com um albergue bem considerado, e Árvore, perto de uma ligação de metro. Partir aqui transforma um primeiro dia duro em dois fáceis e não custa nada de calendário se tiveres os dias."
      - heading: "Chegada a Vila do Conde"
        body: "Atravessas o Rio Ave e a vila apresenta-se sozinha: o Convento de Santa Clara no alto à direita e, ao lado, o Aqueduto de Santa Clara — uma fila de arcos do século XVII que levava água cerca de quatro quilómetros até ao convento. Em baixo, o centro histórico tem supermercados, restaurantes, albergue de peregrinos e praia. É um sítio para ficar, não apenas uma cama no fim de uma seca."
    faq:
      - q: "Qual é a distância do Porto a Vila do Conde?"
        a: "28,4 km com cerca de 354 m de subida acumulada, normalmente seis a sete horas. É a etapa mais longa do Caminho Português da Costa e a subida está muito diluída, por isso a dificuldade vem da distância e da calçada, não das encostas."
      - q: "Devo apanhar o metro para sair do Porto?"
        a: "É uma escolha comum e perfeitamente aceite. Os primeiros 10 km são subúrbio em piso duro, e muitos peregrinos vão de metro até Matosinhos e começam a caminhar a partir da costa. Ninguém verifica e não afeta a tua Compostela, porque a distância que conta é medida em Espanha."
      - q: "Qual é a diferença entre o Caminho da Costa e a Senda Litoral?"
        a: "O Caminho da Costa é o traçado oficialmente sinalizado; a Senda Litoral é a variante de passadiços colada ao Atlântico desde Matosinhos para norte. A Litoral é ligeiramente mais longa e bastante mais bonita, e as duas voltam a juntar-se mais a norte. Quase todos os peregrinos usam os passadiços pelo menos em parte dos primeiros dias."
      - q: "Onde posso partir a etapa do Porto a Vila do Conde?"
        a: "Em Matosinhos, Vila Chã ou Árvore. Matosinhos fica a um metro do Porto e deixa um primeiro dia muito suave; Vila Chã fica a uns 25 minutos fora do trilho, com um albergue bem considerado; Árvore fica perto de uma ligação de metro."
      - q: "Onde carimbo a credencial pela primeira vez?"
        a: "Na Sé do Porto, a catedral onde a rota começa oficialmente. Desde 2025 precisas de dois carimbos por dia durante todo o caminho, não só nos últimos 100 km, por isso começa a reuni-los logo no Porto."
      - q: "A primeira etapa é dura?"
        a: "É longa mais do que íngreme. Quase 30 km de calçada e passeio castigam pés que ainda não caminharam, e é por isso que tantos peregrinos a partem ou saem da cidade de transporte. Se a fizeres inteira, madruga."
    howTo: []
