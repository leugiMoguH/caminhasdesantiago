  es:
    metaTitle: "Esposende a Viana do Castelo (26,3 km): Camino de la Costa etapa 3 (2026)"
    metaDescription: "Etapa 3 del Camino Portugués de la Costa: 26,3 km hacia el interior desde Esposende por Marinhas, Belinho y Castelo de Neiva hasta Viana do Castelo. Dos subidas, 503 m de desnivel, bosque y el puente Eiffel."
    h1: "De Esposende a Viana do Castelo"
    lead: "El día en que la ruta de la Costa deja de ser un paseo de playa. 26,3 km con 503 m de desnivel, casi todo por el interior entre eucaliptos y con dos subidas moderadas — la etapa más dura desde Oporto, y la que acaba cruzando el puente Eiffel hacia Viana."
    sections:
      - heading: "Distancia y dificultad"
        body: "26,3 km con 503 m de desnivel positivo y casi otro tanto de bajada — el triple de subida que el día anterior. Hay dos repechos moderados de unos 100 m cada uno, ninguno empinado, pero llegan a unas piernas que ayer solo pisaron pasarela llana. Seis o siete horas es lo normal. Hay mucho adoquín y los tramos de bosque resbalan con lluvia."
      - heading: "Esta etapa se aleja del mar"
        body: "⚠️ Hoy no esperes Atlántico. La ruta señalizada gira hacia el interior casi al salir de Esposende y no vuelve hasta la aproximación final. Si quieres otro día de pasarela, la variante de la Senda Litoral sigue por la costa — pero el trazado oficial por el bosque es más tranquilo, más verde y el que hace la mayoría."
      - heading: "La etapa, tramo a tramo"
        body: "Esposende → Marinhas → Belinho y la Capela de Santo Amaro → larga bajada entre bosque hasta el río Neiva, que se cruza por la Ponte do Sebastião → subida a la Igreja de Santiago de Castelo de Neiva → ruinas del Mosteiro de São Romão de Neiva → Chafé → Anha → Darque → el puente Eiffel sobre el Lima hasta Viana do Castelo."
      - heading: "Lo mejor y lo peor de la ruta"
        body: "💡 Esta etapa se gana su fama por partida doble. El eucaliptal sobre el Neiva, con senderos de roca cubiertos de musgo y regatos, es de lo más bonito de todo el Camino Portugués. Las carreteras adoquinadas de antes y después son de lo menos amable para los pies. Sube despacio y el día es un placer; ve con prisa y es el día que recuerdan tus rodillas."
      - heading: "Llegada a Viana do Castelo"
        body: "Se abre el estuario del Lima y entras en la ciudad por el puente de hierro salido del taller de Gustave Eiffel. Viana es una ciudad mediana de verdad: supermercados, mucha oferta de restaurantes, un centro histórico que merece una tarde y el Santuário de Santa Luzia coronando el monte, con una de las mejores vistas del norte de Portugal — accesible en funicular si las piernas ya han tenido bastante."
    faq:
      - q: "¿Cuánto hay de Esposende a Viana do Castelo?"
        a: "26,3 km con unos 503 m de desnivel positivo, normalmente entre seis y siete horas. Es una etapa moderada: se sube el triple que el día anterior, aunque ninguna subida es empinada."
      - q: "¿Esta etapa va por la costa?"
        a: "No. La ruta señalizada gira hacia el interior al salir de Esposende y se mantiene tierra adentro entre bosque y aldeas hasta la aproximación final a Viana. La variante de la Senda Litoral sí sigue por la orilla si prefieres otro día de mar."
      - q: "¿Es dura la etapa de Esposende a Viana do Castelo?"
        a: "Moderada. Dos subidas de unos 100 m cada una, mucho adoquín y senderos de bosque que resbalan con lluvia. Viene justo después de la etapa más llana de la ruta, así que el cambio pilla desprevenido: sube despacio."
      - q: "¿Qué merece la pena ver por el camino?"
        a: "La Capela de Santo Amaro en Belinho, la bajada entre bosque hasta el río Neiva y la Ponte do Sebastião, la Igreja de Santiago de Castelo de Neiva en lo alto y las ruinas del Mosteiro de São Romão de Neiva."
      - q: "¿Qué hay que hacer en Viana do Castelo?"
        a: "Es la ciudad más grande desde Oporto: centro histórico, oferta completa de restaurantes y supermercados y el Santuário de Santa Luzia en el monte, con una de las mejores vistas del norte de Portugal. Hay funicular si prefieres no subirlo andando."
