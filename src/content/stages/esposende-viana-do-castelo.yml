  pt:
    metaTitle: "Esposende a Viana do Castelo (26,3 km): Caminho da Costa etapa 3 (2026)"
    metaDescription: "Etapa 3 do Caminho Português da Costa: 26,3 km para o interior de Esposende por Marinhas, Belinho e Castelo de Neiva até Viana do Castelo. Duas subidas, 503 m de desnível, floresta e a ponte Eiffel."
    h1: "De Esposende a Viana do Castelo"
    lead: "O dia em que o Caminho da Costa deixa de ser um passeio de praia. 26,3 km com 503 m de subida, quase tudo pelo interior entre eucaliptos e com duas subidas moderadas — a etapa mais dura desde o Porto, e a que acaba a atravessar a ponte Eiffel para Viana."
    sections:
      - heading: "Distância e dificuldade"
        body: "26,3 km com 503 m de subida acumulada e quase outro tanto de descida — o triplo do dia anterior. Há duas subidas moderadas de cerca de 100 m cada, nenhuma íngreme, mas chegam a pernas que ontem só pisaram passadiço plano. Seis a sete horas é o normal. Há muita calçada e os troços de floresta ficam escorregadios com chuva."
      - heading: "Esta etapa afasta-se do mar"
        body: "⚠️ Hoje não contes com o Atlântico. O trilho sinalizado vira para o interior quase à saída de Esposende e só volta na aproximação final. Se queres mais um dia de passadiço, a variante da Senda Litoral segue pela costa — mas o traçado oficial pela floresta é mais sossegado, mais verde e é o que a maioria faz."
      - heading: "A etapa, troço a troço"
        body: "Esposende → Marinhas → Belinho e a Capela de Santo Amaro → longa descida por floresta até ao rio Neiva, atravessado na Ponte do Sebastião → subida à Igreja de Santiago de Castelo de Neiva → ruínas do Mosteiro de São Romão de Neiva → Chafé → Anha → Darque → a ponte Eiffel sobre o Lima até Viana do Castelo."
      - heading: "O melhor e o pior do Caminho"
        body: "💡 Esta etapa ganha a fama pelos dois lados. O eucaliptal acima do Neiva, com trilhos de rocha coberta de musgo e regatos, é do mais bonito de todo o Caminho Português. As estradas de calçada antes e depois são das menos amigas dos pés. Sobe devagar e o dia é um prazer; vai com pressa e é o dia de que os teus joelhos se lembram."
      - heading: "Chegada a Viana do Castelo"
        body: "O estuário do Lima abre-se e entras na cidade pela ponte de ferro saída da oficina de Gustave Eiffel. Viana é uma cidade média a sério: supermercados, muita escolha de restaurantes, um centro histórico que merece uma tarde e o Santuário de Santa Luzia a coroar o monte, com uma das melhores vistas do norte de Portugal — acessível de funicular se as pernas já chegaram ao limite."
    faq:
      - q: "Qual é a distância de Esposende a Viana do Castelo?"
        a: "26,3 km com cerca de 503 m de subida acumulada, normalmente seis a sete horas. É uma etapa moderada: sobe-se o triplo do dia anterior, embora nenhuma subida seja íngreme."
      - q: "Esta etapa vai pela costa?"
        a: "Não. O trilho sinalizado vira para o interior à saída de Esposende e mantém-se pelo interior, entre floresta e aldeias, até à aproximação final a Viana. A variante da Senda Litoral segue pela orla se preferires mais um dia de mar."
      - q: "A etapa de Esposende a Viana do Castelo é dura?"
        a: "Moderada. Duas subidas de cerca de 100 m cada, muita calçada e trilhos de floresta que escorregam com chuva. Vem logo a seguir à etapa mais plana do Caminho, por isso a mudança apanha as pessoas desprevenidas: sobe devagar."
      - q: "O que vale a pena ver pelo caminho?"
        a: "A Capela de Santo Amaro em Belinho, a descida por floresta até ao rio Neiva e a Ponte do Sebastião, a Igreja de Santiago de Castelo de Neiva no alto e as ruínas do Mosteiro de São Romão de Neiva."
      - q: "O que há para fazer em Viana do Castelo?"
        a: "É a maior cidade desde o Porto: centro histórico, oferta completa de restaurantes e supermercados e o Santuário de Santa Luzia no monte, com uma das melhores vistas do norte de Portugal. Há funicular se preferires não o subir a pé."
