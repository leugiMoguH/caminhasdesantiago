i18n:
  en:
    metaTitle: "Esposende to Viana do Castelo (26.3 km): Coastal Camino Stage 3 (2026)"
    metaDescription: "Stage 3 of the Camino Portugués Coastal: 26.3 km inland from Esposende through Marinhas, Belinho and Castelo de Neiva to Viana do Castelo. Two climbs, 503 m of ascent, forest paths and the Eiffel bridge."
    h1: "Esposende to Viana do Castelo"
    lead: "The day the Coastal route stops being a beach walk. 26.3 km with 503 m of ascent, most of it inland through eucalyptus forest and over two moderate climbs — the hardest stage since Porto, and the one that ends on the Eiffel bridge into Viana."
    sections:
      - heading: "Distance and difficulty"
        body: "26.3 km with 503 m of ascent and almost the same descent — three times the climbing of the day before. There are two moderate climbs of roughly 100 m each, neither steep, but they arrive on legs that spent yesterday on flat boardwalk. Six to seven hours is normal. Cobbles feature heavily, and the forest sections turn slippery in the wet."
      - heading: "This stage leaves the coast"
        body: "⚠️ Do not expect the Atlantic today. The waymarked route turns inland almost immediately out of Esposende and stays there until the final approach. If you specifically want another boardwalk day, the Senda Litoral variant continues up the shoreline instead — but the official line through the forest is quieter, greener and the one most pilgrims walk."
      - heading: "The stage, section by section"
        body: "Esposende → Marinhas → Belinho and the Capela de Santo Amaro → a long descent through forest to the River Neiva, crossed at the Ponte do Sebastião → the climb to the Igreja de Santiago de Castelo de Neiva → the ruins of the Mosteiro de São Romão de Neiva → Chafé → Anha → Darque → the Eiffel bridge over the Lima into Viana do Castelo."
      - heading: "The best and the worst of the route"
        body: "💡 This stage earns its reputation both ways. The eucalyptus forest above the Neiva, with rocky moss-covered paths and streams, is some of the prettiest walking on the whole Camino Portugués. The cobbled backroads either side of it are some of the least kind to feet. Take the climbs slowly and the day is a pleasure; rush them and it is the day your knees remember."
      - heading: "Arriving in Viana do Castelo"
        body: "The Lima estuary opens up and you cross into town on the iron bridge designed by Gustave Eiffel's workshop. Viana is a proper mid-sized town: supermarkets, a wide choice of restaurants, a historic centre worth an evening, and the Santuário de Santa Luzia crowning the hill above with one of the best views in northern Portugal — reachable by funicular if your legs have had enough."
    faq:
      - q: "How long is Esposende to Viana do Castelo?"
        a: "26.3 km with about 503 m of ascent, usually six to seven hours. It is a moderate stage — the climbing is three times the previous day, though no single climb is steep."
      - q: "Does this stage follow the coast?"
        a: "No. The waymarked route turns inland out of Esposende and stays inland through forest and villages until the final approach to Viana. The Senda Litoral variant stays on the shoreline if you would rather have another sea day."
      - q: "Is Esposende to Viana do Castelo hard?"
        a: "Moderate. Two climbs of roughly 100 m each, plenty of cobbles, and forest paths that get slippery in the rain. It follows the flattest stage on the route, so the change catches people out — go slowly on the climbs."
      - q: "What is worth seeing on the way?"
        a: "The Capela de Santo Amaro at Belinho, the forest descent to the River Neiva and the Ponte do Sebastião, the Igreja de Santiago de Castelo de Neiva on its hilltop, and the ruins of the Mosteiro de São Romão de Neiva."
      - q: "What is there to do in Viana do Castelo?"
        a: "It is the largest town since Porto: a historic centre, a full range of restaurants and supermarkets, and the Santuário de Santa Luzia on the hill above, which has one of the best views in northern Portugal. A funicular runs up if you would rather not walk it."
