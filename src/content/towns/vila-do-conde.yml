i18n:
  en:
    metaTitle: "Vila do Conde on the Coastal Camino: Albergue, Aqueduct & Where to Stay"
    metaDescription: "Vila do Conde for pilgrims on the Camino Portugués Coastal: the end of the 28.4 km first stage, the Santa Clara aqueduct and convent, the town albergue, services and where to sleep."
    h1: "Vila do Conde"
    lead: "The end of the longest stage on the Coastal route, and a better reward than most first days give you: a walled convent above the river, a 17th-century aqueduct running out into the countryside, and a beach five minutes from the old town."
    sections:
      - heading: "What you arrive to"
        body: "You cross the Rio Ave and the Convento de Santa Clara rises on your right, a 14th-century foundation set high above the water. Beside it runs the Aqueduto de Santa Clara — an arched line built in the 17th century to carry spring water some four kilometres to the convent. Below, the old town has everything a pilgrim needs within a few streets."
      - heading: "The albergue"
        body: "Vila do Conde has a public pilgrim albergue in the heart of town, Santa Clara. It is a plain, functional place — kitchen, dining area, roof terrace — and it works on a first-come, first-served basis with no reservations. If you are arriving late off the 28.4 km stage in high season, have a fallback booked rather than counting on a bed."
      - heading: "What to see"
        body: "The aqueduct and the convent are the headline. Below them, the Igreja Matriz de São João Baptista dates from the 15th century and sits on the route out of town. Vila do Conde also has a long shipbuilding history on the Ave, and a lace-making tradition that still has a museum. If you have an afternoon, the beach is a short walk west."
      - heading: "Services"
        body: "Supermarkets, pharmacies, cafés and restaurants are all in the centre, and the town is small enough to cover on tired legs. Metro line B connects Vila do Conde to Porto, which makes it a practical place to join or leave the route, or to break the first stage into two if you decide 28.4 km is too much for day one."
    faq:
      - q: "Is there a pilgrim albergue in Vila do Conde?"
        a: "Yes — the public Santa Clara albergue in the town centre. It is basic and functional, with a kitchen, dining area and roof terrace, and it takes pilgrims first-come, first-served with no reservations."
      - q: "What is the Vila do Conde aqueduct?"
        a: "The Aqueduto de Santa Clara, a 17th-century arched aqueduct that carried spring water roughly four kilometres to the Convento de Santa Clara. It runs beside the convent above the Rio Ave and is visible as you walk into town."
      - q: "Can I get to Vila do Conde from Porto by metro?"
        a: "Yes, metro line B connects the two. That makes Vila do Conde easy to reach if you want to split the long first stage, or to skip the Porto suburbs and start walking from here."
      - q: "Where should I stay in Vila do Conde?"
        a: "The historic centre puts restaurants, supermarkets, the albergue and the morning waymarks within two streets — the practical choice after 28.4 km. The beach quarter a few minutes west is often better value and connects straight to the next day's boardwalk."
      - q: "How far is Vila do Conde from Porto on foot?"
        a: "28.4 km by the official Coastal waymarks, with about 354 m of ascent. It is the longest stage of the Portuguese Coastal route, and the Senda Litoral boardwalk variant is slightly longer again."
