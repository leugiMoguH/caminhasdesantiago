whereToStay:
  en:
    intro: "Vila do Conde ends the longest stage on the route, so most pilgrims want somewhere close and horizontal. The town splits neatly into the historic centre by the river and the beach quarter a few minutes west, and the choice mostly comes down to whether you want dinner in the old town or the Atlantic outside the window."
    areas:
      - name: "Historic centre & the Rio Ave"
        blurb: "The streets below the Convento de Santa Clara hold the restaurants, the supermarkets, the pilgrim albergue and the morning waymarks. Arriving off a 28 km day, being able to drop the pack and eat within two streets is worth more than a view. This is also where the aqueduct and the old shipyard are."
        bookingQuery: "Vila do Conde centro histórico"
        anchor: "guesthouses in Vila do Conde's historic centre"
      - name: "Beach & seafront"
        blurb: "A few minutes west the town meets the Atlantic, with a long beach and a promenade that leads straight onto next morning's boardwalk. Rooms here are often better value than the centre and the sunset is the reward for the day you have just had — at the cost of a short walk back in for dinner."
        bookingQuery: "Vila do Conde praia"
        anchor: "seafront rooms near Vila do Conde beach"
  es:
    intro: "Vila do Conde cierra la etapa más larga de la ruta, así que casi todos buscan algo cercano y llano. El pueblo se divide entre el centro histórico junto al río y la zona de playa a unos minutos al oeste, y la elección se reduce a si prefieres cenar en el casco antiguo o tener el Atlántico en la ventana."
    areas:
      - name: "Centro histórico y el Rio Ave"
        blurb: "Las calles bajo el Convento de Santa Clara concentran los restaurantes, los supermercados, el albergue de peregrinos y las flechas de la mañana siguiente. Llegando de una jornada de 28 km, poder soltar la mochila y cenar a dos calles vale más que unas vistas. Aquí están también el acueducto y el viejo astillero."
        bookingQuery: "Vila do Conde centro histórico"
        anchor: "pensiones en el centro histórico de Vila do Conde"
      - name: "Playa y paseo marítimo"
        blurb: "A pocos minutos al oeste el pueblo se encuentra con el Atlántico, con una playa larga y un paseo que enlaza directamente con la pasarela del día siguiente. Aquí las habitaciones suelen salir mejor de precio que en el centro y el atardecer es el premio a la jornada — a cambio de un paseíto de vuelta para cenar."
        bookingQuery: "Vila do Conde playa"
        anchor: "habitaciones frente al mar en la playa de Vila do Conde"
  pt:
    intro: "Vila do Conde fecha a etapa mais longa do Caminho, por isso quase toda a gente quer algo perto e plano. A vila divide-se entre o centro histórico junto ao rio e a zona da praia a poucos minutos a oeste, e a escolha resume-se a se preferes jantar no centro antigo ou ter o Atlântico à janela."
    areas:
      - name: "Centro histórico e o Rio Ave"
        blurb: "As ruas abaixo do Convento de Santa Clara concentram os restaurantes, os supermercados, o albergue de peregrinos e as setas da manhã seguinte. A chegar de um dia de 28 km, poder largar a mochila e jantar a duas ruas vale mais do que uma vista. É aqui que ficam também o aqueduto e o antigo estaleiro."
        bookingQuery: "Vila do Conde centro histórico"
        anchor: "pensões no centro histórico de Vila do Conde"
      - name: "Praia e marginal"
        blurb: "A poucos minutos a oeste a vila encontra o Atlântico, com uma praia longa e uma marginal que liga diretamente ao passadiço da manhã seguinte. Aqui os quartos costumam ter melhor preço do que no centro e o pôr do sol é o prémio pelo dia que acabaste de fazer — em troca de um passeio de volta para jantar."
        bookingQuery: "Vila do Conde praia"
        anchor: "quartos à beira-mar na praia de Vila do Conde"
