    h1: "Vila do Conde"
    lead: "O fim da etapa mais longa do Caminho da Costa, e uma recompensa melhor do que a de quase qualquer primeiro dia: um convento muralhado sobre o rio, um aqueduto do século XVII que se perde para o campo e uma praia a cinco minutos do centro antigo."
    sections:
      - heading: "O que encontras à chegada"
        body: "Atravessas o Rio Ave e o Convento de Santa Clara ergue-se à direita, uma fundação do século XIV bem acima da água. Ao lado corre o Aqueduto de Santa Clara — uma linha de arcos construída no século XVII para levar água de nascente cerca de quatro quilómetros até ao convento. Em baixo, o centro histórico tem tudo o que um peregrino precisa em poucas ruas."
      - heading: "O albergue"
        body: "Vila do Conde tem um albergue público de peregrinos em pleno centro, o Santa Clara. É um sítio simples e funcional — cozinha, sala de refeições, terraço — e funciona por ordem de chegada, sem reservas. Se chegares tarde depois dos 28,4 km em época alta, tem uma alternativa reservada em vez de contares com uma cama."
      - heading: "O que ver"
        body: "O aqueduto e o convento são o principal. Por baixo, a Igreja Matriz de São João Baptista é do século XV e fica no caminho de saída da vila. Vila do Conde tem ainda uma longa história de construção naval no Ave e uma tradição de rendas de bilros que mantém museu. Se te sobrar a tarde, a praia fica a um passeio para oeste."
      - heading: "Serviços"
        body: "Supermercados, farmácias, cafés e restaurantes estão todos no centro, e a vila é pequena o suficiente para se percorrer com pernas cansadas. A linha B do metro liga Vila do Conde ao Porto, o que faz dela um sítio prático para entrar ou sair do Caminho, ou para partir em duas a primeira etapa se decidires que 28,4 km é demasiado para o primeiro dia."
    faq:
      - q: "Há albergue de peregrinos em Vila do Conde?"
        a: "Sim, o albergue público Santa Clara, no centro. É básico e funcional, com cozinha, sala de refeições e terraço, e recebe peregrinos por ordem de chegada, sem reservas."
      - q: "O que é o aqueduto de Vila do Conde?"
        a: "O Aqueduto de Santa Clara, do século XVII, que levava água de nascente cerca de quatro quilómetros até ao Convento de Santa Clara. Corre junto ao convento, sobre o Rio Ave, e vê-se ao entrar na vila."
      - q: "Dá para chegar a Vila do Conde a partir do Porto de metro?"
        a: "Sim, a linha B do metro liga as duas. Isso torna fácil chegar a Vila do Conde se quiseres partir a longa primeira etapa, ou saltar o subúrbio do Porto e começar a caminhar daqui."
      - q: "Onde devo dormir em Vila do Conde?"
        a: "O centro histórico deixa restaurantes, supermercados, albergue e as setas da manhã a duas ruas — a escolha prática depois de 28,4 km. A zona da praia, a poucos minutos para oeste, costuma ter melhor preço e liga diretamente ao passadiço do dia seguinte."
      - q: "Qual é a distância do Porto a Vila do Conde a pé?"
        a: "28,4 km pelas setas oficiais da Costa, com cerca de 354 m de subida acumulada. É a etapa mais longa do Caminho Português da Costa, e a variante da Senda Litoral é ainda um pouco mais longa."
