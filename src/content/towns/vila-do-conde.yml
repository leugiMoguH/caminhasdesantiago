  es:
    metaTitle: "Vila do Conde en el Camino de la Costa: albergue, acueducto y dónde dormir"
    metaDescription: "Vila do Conde para peregrinos del Camino Portugués de la Costa: final de la primera etapa de 28,4 km, el acueducto y convento de Santa Clara, el albergue del pueblo, servicios y dónde dormir."
    h1: "Vila do Conde"
    lead: "El final de la etapa más larga de la ruta de la Costa, y una recompensa mejor que la de casi cualquier primer día: un convento amurallado sobre el río, un acueducto del siglo XVII que se pierde hacia el campo y una playa a cinco minutos del casco antiguo."
    sections:
      - heading: "Lo que te encuentras al llegar"
        body: "Cruzas el Rio Ave y el Convento de Santa Clara se levanta a la derecha, una fundación del siglo XIV muy por encima del agua. A su lado corre el Acueducto de Santa Clara — una línea de arcos construida en el siglo XVII para llevar agua de manantial unos cuatro kilómetros hasta el convento. Abajo, el casco antiguo tiene todo lo que un peregrino necesita en unas pocas calles."
      - heading: "El albergue"
        body: "Vila do Conde tiene un albergue público de peregrinos en pleno centro, el Santa Clara. Es un sitio sencillo y funcional — cocina, comedor, azotea — y funciona por orden de llegada, sin reservas. Si llegas tarde después de los 28,4 km en temporada alta, ten una alternativa reservada en vez de confiar en una plaza."
      - heading: "Qué ver"
        body: "El acueducto y el convento son lo principal. Debajo, la Igreja Matriz de São João Baptista es del siglo XV y queda en la salida del pueblo. Vila do Conde tiene además una larga historia de construcción naval en el Ave y una tradición de encaje que conserva museo. Si te sobra la tarde, la playa está a un paseo hacia el oeste."
      - heading: "Servicios"
        body: "Supermercados, farmacias, cafés y restaurantes están todos en el centro, y el pueblo es lo bastante pequeño para recorrerlo con las piernas cansadas. La línea B del metro conecta Vila do Conde con Oporto, lo que la convierte en un sitio práctico para entrar o salir de la ruta, o para partir en dos la primera etapa si decides que 28,4 km son demasiados para el primer día."
    faq:
      - q: "¿Hay albergue de peregrinos en Vila do Conde?"
        a: "Sí, el albergue público Santa Clara, en el centro. Es básico y funcional, con cocina, comedor y azotea, y admite peregrinos por orden de llegada, sin reservas."
      - q: "¿Qué es el acueducto de Vila do Conde?"
        a: "El Acueducto de Santa Clara, del siglo XVII, que llevaba agua de manantial unos cuatro kilómetros hasta el Convento de Santa Clara. Corre junto al convento sobre el Rio Ave y se ve al entrar en el pueblo."
      - q: "¿Se puede llegar a Vila do Conde desde Oporto en metro?"
        a: "Sí, la línea B del metro une ambas. Eso hace fácil llegar a Vila do Conde si quieres partir la larga primera etapa, o saltarte el extrarradio de Oporto y empezar a caminar desde aquí."
      - q: "¿Dónde conviene dormir en Vila do Conde?"
        a: "El centro histórico deja restaurantes, supermercados, albergue y las flechas de la mañana a dos calles — la opción práctica después de 28,4 km. La zona de playa, unos minutos al oeste, suele salir mejor de precio y enlaza directamente con la pasarela del día siguiente."
      - q: "¿Cuánto hay de Oporto a Vila do Conde andando?"
        a: "28,4 km por las flechas oficiales de la Costa, con unos 354 m de desnivel positivo. Es la etapa más larga del Camino Portugués de la Costa, y la variante de la Senda Litoral es algo más larga todavía."
