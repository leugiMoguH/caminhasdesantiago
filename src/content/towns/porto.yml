i18n:
  en:
    metaTitle: "Porto for Pilgrims: Where the Camino Portugués Starts (2026)"
    metaDescription: "Porto as a Camino starting point: where the route officially begins, your first credential stamp, choosing Coastal or Central, what to see before you walk, and which neighbourhood to sleep in."
    h1: "Porto — where the Camino Portugués begins"
    lead: "Every Camino Portugués starts here, at the cathedral on the hill. Before you walk you have three decisions to make: Coastal or Central, official route or boardwalk, and which side of the city to sleep on. Here is what each one means."
    sections:
      - heading: "The official starting point"
        body: "The Camino Portugués begins at the Sé do Porto, the fortress-like 12th-century cathedral above São Bento station. Collect your first credential stamp there. From the cathedral the waymarks head north; a few kilometres on, at the Cruzeiro do Senhor, the Coastal and Central routes divide and you commit to one."
      - heading: "Coastal or Central: deciding before you leave"
        body: "💡 The Central route runs inland through Barcelos and Ponte de Lima — older, more historic, more villages, more pilgrims. The Coastal route follows the Atlantic through Vila do Conde, Esposende and Viana do Castelo before crossing into Galicia at Caminha. The Coastal is flatter, cooler in summer and far less crowded on the stretches that matter. Both reach Santiago and both earn the Compostela."
      - heading: "What to see before you walk"
        body: "Porto rewards a full day before you start. The Sé itself and its cloister; the Ribeira riverfront under the Ponte Luís I, tiled and terraced and rightly UNESCO-listed; the Igreja de São Francisco with its gilded interior; the Torre dos Clérigos for the view over the whole city; Livraria Lello, the bookshop everybody queues for; the azulejo panels inside São Bento station, which you will walk past anyway; and the Mercado do Bolhão for lunch. The centre is small enough to cover on foot, which doubles as a way to break in your boots."
      - heading: "Getting your credential"
        body: "You need a credential before you start collecting stamps, and Porto issues them — the cathedral is the obvious place. Since the 2025 rule change you need two stamps a day for the whole route, not just the final 100 km, so get into the habit from the first café. Albergues, churches, cafés and town halls all stamp."
      - heading: "Three ways out of the city"
        body: "⚠️ The first 10 km are suburb: pavement, retail parks and cobbles. Your options are to walk the official waymarked line all the way; to take the metro or a bus to the edge of the city and start from there, which is common and costs you nothing towards the Compostela; or to head for Matosinhos and pick up the Senda Litoral boardwalks along the Atlantic — technically a variant, considerably prettier, and what most pilgrims actually do."
    faq:
      - q: "Where does the Camino Portugués start in Porto?"
        a: "At the Sé do Porto, the cathedral above São Bento station. That is the official starting point and where most pilgrims collect their first credential stamp. The Coastal and Central routes split a few kilometres north, at the Cruzeiro do Senhor."
      - q: "How many days is Porto to Santiago on the Coastal route?"
        a: "Around 12 to 14 walking days for roughly 280 km. The first stage to Vila do Conde is the longest at 28.4 km; most of the rest fall between 16 and 27 km."
      - q: "Should I walk out of Porto or take the metro?"
        a: "Both are normal. The first 10 km are city suburb on hard pavement, and plenty of pilgrims ride the metro to Matosinhos and start walking at the coast. It has no effect on the Compostela, since the qualifying distance is counted in Spain."
      - q: "Where should I stay in Porto before starting?"
        a: "Near the Sé if you want to start walking straight from the door; Ribeira for atmosphere at a price; Bolhão and São Bento for value and transport links; Matosinhos or Foz if you plan to start on the Senda Litoral boardwalks instead of the official line."
      - q: "Can I get a pilgrim credential in Porto?"
        a: "Yes. The cathedral issues credentials, and it is the natural place to pick one up since the route starts there. Get it before your first stamp."
      - q: "Coastal or Central route from Porto?"
        a: "The Coastal is flatter, follows the Atlantic, is cooler in summer and less crowded; the Central is more historic and passes through Barcelos and Ponte de Lima. Both arrive in Santiago and both qualify for the Compostela — pick on scenery and crowds, not on rules."
