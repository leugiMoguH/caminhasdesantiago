  pt:
    metaTitle: "Porto para peregrinos: onde começa o Caminho Português (2026)"
    metaDescription: "O Porto como ponto de partida do Caminho: onde a rota começa oficialmente, o primeiro carimbo da credencial, escolher Costa ou Central, o que ver antes de caminhar e em que zona dormir."
    h1: "Porto — onde começa o Caminho Português"
    lead: "Todos os Caminhos Portugueses começam aqui, na catedral do alto. Antes de caminhares tens três decisões: Costa ou Central, trilho oficial ou passadiço, e em que lado da cidade dormir. Isto é o que cada uma significa."
    sections:
      - heading: "O ponto de partida oficial"
        body: "O Caminho Português começa na Sé do Porto, a catedral do século XII com ar de fortaleza acima da estação de São Bento. Carimba aí a credencial pela primeira vez. Da catedral as setas seguem para norte; poucos quilómetros depois, no Cruzeiro do Senhor, separam-se o Caminho da Costa e o Central e tens de escolher."
      - heading: "Costa ou Central: decidir antes de sair"
        body: "💡 O Central vai pelo interior, por Barcelos e Ponte de Lima — mais antigo, mais histórico, mais aldeias e mais peregrinos. O da Costa segue o Atlântico por Vila do Conde, Esposende e Viana do Castelo antes de entrar na Galiza em Caminha. O da Costa é mais plano, mais fresco no verão e bastante menos concorrido nos troços que interessam. Ambos chegam a Santiago e ambos dão direito à Compostela."
      - heading: "O que ver antes de caminhar"
        body: "O Porto merece um dia inteiro antes de começares. A própria Sé e o seu claustro; a Ribeira sob a Ponte Luís I, de azulejo e esplanadas e com razão Património Mundial; a Igreja de São Francisco e o seu interior dourado; a Torre dos Clérigos pela vista sobre a cidade toda; a Livraria Lello, a livraria a que toda a gente faz fila; os painéis de azulejo da estação de São Bento, por onde vais passar de qualquer maneira; e o Mercado do Bolhão para almoçar. O centro faz-se a pé, o que também serve para amaciar as botas."
      - heading: "Obter a credencial"
        body: "Precisas da credencial antes de começares a carimbar, e o Porto emite-as — a catedral é o sítio óbvio. Desde a mudança de regras de 2025 precisas de dois carimbos por dia durante todo o percurso, não apenas nos últimos 100 km, por isso ganha o hábito logo no primeiro café. Carimbam albergues, igrejas, cafés e câmaras municipais."
      - heading: "Três maneiras de sair da cidade"
        body: "⚠️ Os primeiros 10 km são subúrbio: passeio, parques comerciais e calçada. Podes fazer todo o traçado oficial a pé; apanhar o metro ou um autocarro até ao limite da cidade e começar aí, o que é comum e não tira nada à Compostela; ou ir até Matosinhos e apanhar os passadiços da Senda Litoral junto ao Atlântico — tecnicamente uma variante, bastante mais bonita, e o que a maioria faz na prática."
    faq:
      - q: "Onde começa o Caminho Português no Porto?"
        a: "Na Sé do Porto, a catedral acima da estação de São Bento. É o ponto de partida oficial e onde quase todos carimbam pela primeira vez. Os Caminhos da Costa e Central separam-se poucos quilómetros a norte, no Cruzeiro do Senhor."
      - q: "Quantos dias são do Porto a Santiago pela Costa?"
        a: "Cerca de 12 a 14 dias de caminhada para uns 280 km. A primeira etapa até Vila do Conde é a mais longa, com 28,4 km; as restantes ficam quase todas entre 16 e 27 km."
      - q: "Saio do Porto a pé ou de metro?"
        a: "As duas coisas são normais. Os primeiros 10 km são subúrbio em piso duro e muitos peregrinos vão de metro até Matosinhos e começam a caminhar na costa. Não afeta a Compostela, porque a distância que conta é medida em Espanha."
      - q: "Onde devo dormir no Porto antes de começar?"
        a: "Junto à Sé se quiseres sair a caminhar da porta; na Ribeira pelo ambiente, pagando por isso; no Bolhão e em São Bento por preço e transportes; em Matosinhos ou na Foz se pensares começar pelos passadiços da Senda Litoral em vez do traçado oficial."
      - q: "Posso obter a credencial do peregrino no Porto?"
        a: "Sim. A catedral emite credenciais e é o sítio natural para a levantar, já que a rota começa ali. Trata dela antes do primeiro carimbo."
      - q: "Caminho da Costa ou Central a partir do Porto?"
        a: "O da Costa é mais plano, segue o Atlântico, é mais fresco no verão e menos concorrido; o Central é mais histórico e passa por Barcelos e Ponte de Lima. Os dois chegam a Santiago e os dois valem para a Compostela — escolhe pela paisagem e pela gente, não por regras."
