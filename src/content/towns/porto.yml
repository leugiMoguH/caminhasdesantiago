  es:
    metaTitle: "Oporto para peregrinos: dónde empieza el Camino Portugués (2026)"
    metaDescription: "Oporto como punto de partida del Camino: dónde arranca oficialmente la ruta, el primer sello de la credencial, elegir Costa o Central, qué ver antes de caminar y en qué barrio dormir."
    h1: "Oporto — donde empieza el Camino Portugués"
    lead: "Todos los Caminos Portugueses empiezan aquí, en la catedral de lo alto. Antes de caminar tienes tres decisiones: Costa o Central, ruta oficial o pasarela, y en qué parte de la ciudad dormir. Esto es lo que significa cada una."
    sections:
      - heading: "El punto de partida oficial"
        body: "El Camino Portugués empieza en la Sé do Porto, la catedral del siglo XII con aire de fortaleza sobre la estación de São Bento. Sella allí la credencial por primera vez. Desde la catedral las flechas van hacia el norte; unos kilómetros después, en el Cruzeiro do Senhor, se separan la ruta de la Costa y la Central y hay que elegir."
      - heading: "Costa o Central: decidir antes de salir"
        body: "💡 La Central va por el interior, por Barcelos y Ponte de Lima — más antigua, más histórica, más pueblos y más peregrinos. La Costa sigue el Atlántico por Vila do Conde, Esposende y Viana do Castelo antes de cruzar a Galicia en Caminha. La Costa es más llana, más fresca en verano y mucho menos concurrida en los tramos que importan. Ambas llegan a Santiago y ambas dan derecho a la Compostela."
      - heading: "Qué ver antes de caminar"
        body: "Oporto merece un día entero antes de empezar. La propia Sé y su claustro; la Ribeira bajo el Puente Luís I, de azulejo y terrazas y con razón Patrimonio de la Humanidad; la Igreja de São Francisco y su interior dorado; la Torre dos Clérigos por la vista sobre toda la ciudad; la Livraria Lello, la librería por la que todo el mundo hace cola; los paneles de azulejo de la estación de São Bento, por la que vas a pasar de todas formas; y el Mercado do Bolhão para comer. El centro se recorre a pie, lo que además sirve para domar las botas."
      - heading: "Conseguir la credencial"
        body: "Necesitas la credencial antes de empezar a sellar, y en Oporto se expide — la catedral es el sitio obvio. Desde el cambio de normas de 2025 necesitas dos sellos al día durante todo el recorrido, no solo en los últimos 100 km, así que coge la costumbre desde el primer café. Sellan albergues, iglesias, cafés y ayuntamientos."
      - heading: "Tres maneras de salir de la ciudad"
        body: "⚠️ Los primeros 10 km son extrarradio: acera, polígonos y adoquín. Puedes hacer todo el trazado oficial andando; tomar el metro o un autobús hasta el borde de la ciudad y empezar allí, algo habitual y que no resta nada para la Compostela; o ir a Matosinhos y engancharte a las pasarelas de la Senda Litoral junto al Atlántico — técnicamente una variante, bastante más bonita y lo que hace en realidad la mayoría."
    faq:
      - q: "¿Dónde empieza el Camino Portugués en Oporto?"
        a: "En la Sé do Porto, la catedral sobre la estación de São Bento. Es el punto de partida oficial y donde casi todos sellan por primera vez. Las rutas de la Costa y la Central se separan unos kilómetros al norte, en el Cruzeiro do Senhor."
      - q: "¿Cuántos días son de Oporto a Santiago por la Costa?"
        a: "Entre 12 y 14 jornadas de caminata para unos 280 km. La primera etapa hasta Vila do Conde es la más larga, con 28,4 km; el resto suele quedar entre 16 y 27 km."
      - q: "¿Salgo de Oporto andando o en metro?"
        a: "Las dos cosas son normales. Los primeros 10 km son extrarradio sobre pavimento duro y muchos peregrinos van en metro hasta Matosinhos y empiezan a caminar en la costa. No afecta a la Compostela, porque la distancia que cuenta se mide en España."
      - q: "¿Dónde conviene dormir en Oporto antes de empezar?"
        a: "Junto a la Sé si quieres salir caminando desde la puerta; en la Ribeira por el ambiente, pagando por ello; en Bolhão y São Bento por precio y transporte; en Matosinhos o Foz si piensas empezar por las pasarelas de la Senda Litoral en vez del trazado oficial."
      - q: "¿Puedo conseguir la credencial del peregrino en Oporto?"
        a: "Sí. La catedral expide credenciales y es el sitio natural para recogerla, ya que la ruta arranca allí. Consíguela antes del primer sello."
      - q: "¿Ruta de la Costa o Central desde Oporto?"
        a: "La Costa es más llana, sigue el Atlántico, es más fresca en verano y menos concurrida; la Central es más histórica y pasa por Barcelos y Ponte de Lima. Las dos llegan a Santiago y las dos valen para la Compostela — elige por paisaje y gente, no por normas."
