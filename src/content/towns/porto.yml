whereToStay:
  en:
    intro: "Porto is where the Camino Portugués starts, and where most pilgrims spend a night or two before walking. The choice that matters is not luxury but geography: sleep near the Sé and you step out of the door onto the route; sleep at the coast and you are positioned for the boardwalk instead. Prices swing hard between the riverside and everywhere else, so the areas below trade location against value."
    areas:
      - name: "Sé & Baixa — on the start line"
        blurb: "The streets around the cathedral put you metres from the official starting point and the first waymarks. You can collect your credential stamp at the Sé and be walking within five minutes of leaving your room — worth a lot on a day where the stage is already 28 km. Central, well served by restaurants, and steeply uphill from the river."
        bookingQuery: "Porto Sé Cathedral"
        anchor: "hotels and guesthouses beside Porto Cathedral"
      - name: "Ribeira & the riverfront"
        blurb: "The UNESCO-listed riverside under the Ponte Luís I is the Porto everyone pictures: tiled façades, terraces and the Douro at your feet. It is the most atmospheric place to spend the night before you start, and the most expensive. Note that it sits at the bottom of the hill, so the morning begins with a climb."
        bookingQuery: "Porto Ribeira"
        anchor: "riverside stays in Ribeira"
      - name: "Bolhão & Santo Ildefonso"
        blurb: "The blocks around the Mercado do Bolhão and São Bento station are the practical choice: cheaper than the river, walkable to the Sé, and right on top of the metro and the train if you are arriving late or flying out from here after Santiago. Good cafés, fewer tourists, easier value."
        bookingQuery: "Porto Bolhao Santo Ildefonso"
        anchor: "better-value rooms near Bolhão and São Bento"
      - name: "Foz & Matosinhos — the boardwalk start"
        blurb: "If you plan to skip the city suburbs and start on the Senda Litoral boardwalks, sleeping at the coast saves you the morning metro. Matosinhos has the seafood restaurants and the tram and metro links; Foz is quieter and smarter. Either puts the Atlantic outside your window on day one."
        bookingQuery: "Matosinhos Porto beach"
        anchor: "seafront stays in Matosinhos and Foz"
      - name: "Vila Nova de Gaia — across the Douro"
        blurb: "The south bank looks straight back at the Ribeira postcard and usually costs less for the same standard, with the port lodges at street level. The trade-off is real though: you start the morning by crossing the Ponte Luís I and climbing to the Sé before the Camino has even begun."
        bookingQuery: "Vila Nova de Gaia Porto"
        anchor: "better-value rooms in Vila Nova de Gaia"
  es:
    intro: "Oporto es donde empieza el Camino Portugués y donde casi todos los peregrinos pasan una o dos noches antes de caminar. Lo que importa no es el lujo sino la geografía: si duermes junto a la Sé, sales por la puerta directo a la ruta; si duermes en la costa, quedas colocado para las pasarelas. Los precios cambian mucho entre la ribera y el resto, así que estas zonas equilibran ubicación y valor."
    areas:
      - name: "Sé y Baixa — en la línea de salida"
        blurb: "Las calles junto a la catedral te dejan a metros del punto de partida oficial y de las primeras flechas. Puedes sellar la credencial en la Sé y estar caminando cinco minutos después de salir de la habitación, algo que se agradece en una etapa de 28 km. Céntrico, con muchos restaurantes y bastante cuesta arriba desde el río."
        bookingQuery: "Oporto Sé catedral"
        anchor: "hoteles y pensiones junto a la catedral de Oporto"
      - name: "Ribeira y la ribera del Duero"
        blurb: "La ribera declarada Patrimonio de la Humanidad, bajo el Puente Luís I, es el Oporto que todo el mundo imagina: fachadas de azulejo, terrazas y el Duero a tus pies. Es el sitio con más ambiente para la noche previa y también el más caro. Ojo: está abajo del todo, así que la mañana empieza con subida."
        bookingQuery: "Oporto Ribeira"
        anchor: "alojamientos junto al río en la Ribeira"
      - name: "Bolhão y Santo Ildefonso"
        blurb: "Las manzanas alrededor del Mercado do Bolhão y la estación de São Bento son la opción práctica: más baratas que el río, a pie de la Sé y encima del metro y el tren si llegas tarde o vuelas desde aquí después de Santiago. Buenos cafés, menos turistas y mejor relación calidad-precio."
        bookingQuery: "Oporto Bolhao Santo Ildefonso"
        anchor: "habitaciones con mejor precio cerca de Bolhão y São Bento"
      - name: "Foz y Matosinhos — la salida por la pasarela"
        blurb: "Si piensas saltarte el extrarradio y empezar por las pasarelas de la Senda Litoral, dormir en la costa te ahorra el metro de la mañana. Matosinhos tiene los restaurantes de marisco y las conexiones de tranvía y metro; Foz es más tranquilo y elegante. Cualquiera de los dos te pone el Atlántico en la ventana el primer día."
        bookingQuery: "Matosinhos Oporto playa"
        anchor: "alojamientos frente al mar en Matosinhos y Foz"
      - name: "Vila Nova de Gaia — al otro lado del Duero"
        blurb: "La orilla sur mira de frente a la postal de la Ribeira y suele costar menos por la misma categoría, con las bodegas de vino de Oporto a pie de calle. El precio a pagar es real: empiezas la mañana cruzando el Puente Luís I y subiendo hasta la Sé antes de que el Camino haya empezado siquiera."
        bookingQuery: "Vila Nova de Gaia Oporto"
        anchor: "habitaciones con mejor precio en Vila Nova de Gaia"
  pt:
    intro: "O Porto é onde o Caminho Português começa e onde quase todos os peregrinos passam uma ou duas noites antes de caminhar. O que interessa não é o luxo, é a geografia: se dormires junto à Sé, sais porta fora direto para o trilho; se dormires na costa, ficas posicionado para os passadiços. Os preços variam muito entre a ribeira e o resto, por isso estas zonas equilibram localização e valor."
    areas:
      - name: "Sé e Baixa — na linha de partida"
        blurb: "As ruas junto à catedral deixam-te a metros do ponto de partida oficial e das primeiras setas. Podes carimbar a credencial na Sé e estar a caminhar cinco minutos depois de sair do quarto, o que conta muito num dia que já tem 28 km. Central, com restaurantes à mão e bem a subir desde o rio."
        bookingQuery: "Porto Sé catedral"
        anchor: "hotéis e pensões junto à Sé do Porto"
      - name: "Ribeira e a marginal do Douro"
        blurb: "A ribeira classificada pela UNESCO, sob a Ponte Luís I, é o Porto que toda a gente imagina: fachadas de azulejo, esplanadas e o Douro aos pés. É o sítio com mais ambiente para a noite anterior e também o mais caro. Atenção: fica no fundo da encosta, por isso a manhã começa a subir."
        bookingQuery: "Porto Ribeira"
        anchor: "alojamentos à beira-rio na Ribeira"
      - name: "Bolhão e Santo Ildefonso"
        blurb: "Os quarteirões à volta do Mercado do Bolhão e da estação de São Bento são a escolha prática: mais baratos do que o rio, a pé da Sé e em cima do metro e do comboio se chegares tarde ou voares daqui depois de Santiago. Bons cafés, menos turistas e melhor relação qualidade-preço."
        bookingQuery: "Porto Bolhao Santo Ildefonso"
        anchor: "quartos com melhor preço perto do Bolhão e de São Bento"
      - name: "Foz e Matosinhos — a partida pelo passadiço"
        blurb: "Se pensas saltar o subúrbio e começar pelos passadiços da Senda Litoral, dormir na costa poupa-te o metro da manhã. Matosinhos tem os restaurantes de marisco e as ligações de elétrico e metro; a Foz é mais sossegada e mais chique. Qualquer um põe-te o Atlântico à janela no primeiro dia."
        bookingQuery: "Matosinhos Porto praia"
        anchor: "alojamentos à beira-mar em Matosinhos e na Foz"
      - name: "Vila Nova de Gaia — do outro lado do Douro"
        blurb: "A margem sul olha de frente para o postal da Ribeira e costuma custar menos pela mesma categoria, com as caves do vinho do Porto ao nível da rua. O preço a pagar é real: começas a manhã a atravessar a Ponte Luís I e a subir até à Sé antes de o Caminho sequer ter começado."
        bookingQuery: "Vila Nova de Gaia Porto"
        anchor: "quartos com melhor preço em Vila Nova de Gaia"
