whereToStay:
  en:
    intro: "Esposende sits on the north bank of the Rio Cávado where the river meets the Atlantic, and it is bigger and busier than pilgrims expect — a surf town as much as a Camino stop. Beds are easier here than in the villages either side, but the next stage is the hardest since Porto, so sleep close to the waymarks and start early."
    areas:
      - name: "Town centre & the Cávado"
        blurb: "The centre holds both large supermarkets, the restaurants and the morning route out towards Marinhas. It is compact, flat and cheap by Portuguese coastal standards, and it puts you in the right position for a stage that climbs 503 m — you want to be walking, not crossing town, at first light."
        bookingQuery: "Esposende centro"
        anchor: "guesthouses and hostels in Esposende centre"
      - name: "Ofir & the beach across the river"
        blurb: "Over the bridge on the south bank, Ofir has the pine woods, the dunes and the wide beach that draw the windsurfers. It is the nicer place to spend an evening and often the better room for the money, at the cost of recrossing the Cávado in the morning — fine if you are taking a rest day, less ideal before a 26 km stage."
        bookingQuery: "Ofir Esposende praia"
        anchor: "beach stays at Ofir, across the Cávado"
  es:
    intro: "Esposende está en la orilla norte del Rio Cávado, donde el río se encuentra con el Atlántico, y es más grande y con más vida de lo que el peregrino espera — tanto pueblo surfero como parada del Camino. Aquí hay más camas que en las aldeas de alrededor, pero la etapa siguiente es la más dura desde Oporto, así que duerme cerca de las flechas y madruga."
    areas:
      - name: "Centro y el Cávado"
        blurb: "El centro reúne los dos supermercados grandes, los restaurantes y la salida de la mañana hacia Marinhas. Es compacto, llano y barato para lo que es la costa portuguesa, y te deja bien colocado para una etapa que sube 503 m — al amanecer conviene estar caminando, no cruzando el pueblo."
        bookingQuery: "Esposende centro"
        anchor: "pensiones y hostels en el centro de Esposende"
      - name: "Ofir y la playa al otro lado del río"
        blurb: "Pasado el puente, en la orilla sur, Ofir tiene los pinares, las dunas y la playa ancha que atrae a los windsurfistas. Es mejor sitio para pasar la tarde y muchas veces mejor habitación por el mismo dinero, a cambio de volver a cruzar el Cávado por la mañana — bien si haces día de descanso, menos ideal antes de 26 km."
        bookingQuery: "Ofir Esposende playa"
        anchor: "alojamientos de playa en Ofir, al otro lado del Cávado"
  pt:
    intro: "Esposende fica na margem norte do Rio Cávado, onde o rio encontra o Atlântico, e é maior e mais movimentada do que o peregrino espera — tanto terra de surf como paragem do Caminho. Há mais camas aqui do que nas aldeias em redor, mas a etapa seguinte é a mais dura desde o Porto, por isso dorme perto das setas e sai cedo."
    areas:
      - name: "Centro e o Cávado"
        blurb: "O centro junta os dois supermercados grandes, os restaurantes e a saída da manhã em direção a Marinhas. É compacto, plano e barato para o que é a costa portuguesa, e deixa-te bem posicionado para uma etapa que sobe 503 m — ao amanhecer convém estar a caminhar, não a atravessar a vila."
        bookingQuery: "Esposende centro"
        anchor: "pensões e hostels no centro de Esposende"
      - name: "Ofir e a praia do outro lado do rio"
        blurb: "Passada a ponte, na margem sul, Ofir tem os pinhais, as dunas e o areal largo que atrai os windsurfistas. É melhor sítio para passar a tarde e muitas vezes melhor quarto pelo mesmo dinheiro, em troca de voltar a atravessar o Cávado de manhã — ótimo se fizeres dia de descanso, menos ideal antes de 26 km."
        bookingQuery: "Ofir Esposende praia"
        anchor: "alojamentos de praia em Ofir, do outro lado do Cávado"
