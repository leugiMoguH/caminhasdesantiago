  es:
    metaTitle: "Esposende en el Camino de la Costa: servicios, fuerte y dónde dormir"
    metaDescription: "Esposende para peregrinos del Camino Portugués de la Costa: final de la etapa fácil de 23,7 km por pasarela, el fuerte del siglo XV, supermercados y alojamiento, y qué esperar del día duro que viene."
    h1: "Esposende"
    lead: "El final del día más llano y fácil de la ruta de la Costa y el inicio del más duro desde Oporto. Esposende es un pueblo surfero en la desembocadura del Cávado con más vida, más tiendas y más camas de lo que su tamaño sugiere — aprovéchalo, porque mañana se sube."
    sections:
      - heading: "Lo que te encuentras al llegar"
        body: "Cruzas el Rio Cávado por el puente metálico de Fão y Esposende se abre en la otra orilla. Es un pueblo de verdad, no una aldea: dos supermercados grandes, oferta completa de restaurantes, bares y cafés, y varios hostels y pensiones. Después de un día de pasarela y chiringuitos casi parece ajetreado."
      - heading: "El fuerte y la desembocadura"
        body: "El Forte de São João Baptista, del siglo XV, vigila la boca del Cávado y ofrece vistas largas a lo largo de la costa. Está a un paseo del centro y es el plan obvio si te sobra una hora. La propia desembocadura es lo que define al pueblo: agua resguardada a un lado y Atlántico abierto al otro."
      - heading: "Pueblo de windsurf y kitesurf"
        body: "Esposende y las playas de Ofir, al otro lado del río, están entre los spots de windsurf y kitesurf más conocidos del norte de Portugal. Por eso el paseo marítimo tiene más restaurantes y bares de los que le tocarían por tamaño, y por eso en agosto las habitaciones se aprietan por motivos que no tienen nada que ver con el Camino."
      - heading: "Prepara el día siguiente"
        body: "⚠️ La etapa a Viana do Castelo son 26,3 km con 503 m de desnivel — el triple de lo que has subido hoy, y por una ruta que deja la costa y se mete tierra adentro entre bosque. Abastécete aquí: las aldeas del camino tienen menos de lo que te gustaría. Llena agua, compra la comida y sal temprano si aprieta el calor."
    faq:
      - q: "¿Qué ofrece Esposende al peregrino?"
        a: "Dos supermercados grandes, muchos restaurantes, bares y cafés, farmacia y cajeros, y varios hostels y pensiones. Es el pueblo más grande entre Vila do Conde y Viana do Castelo."
      - q: "¿Hay algo que ver en Esposende?"
        a: "El Forte de São João Baptista, un fuerte del siglo XV que vigila la desembocadura del Rio Cávado, con vistas a lo largo de la costa. Al otro lado del río, Ofir tiene pinares, dunas y una playa ancha muy popular entre windsurfistas y kitesurfistas."
      - q: "¿Cómo de dura es la etapa después de Esposende?"
        a: "Moderada y la más dura desde Oporto: 26,3 km hasta Viana do Castelo con unos 503 m de desnivel, dos subidas de unos 100 m cada una y un largo tramo interior entre eucaliptos. Abastécete en Esposende antes de salir."
      - q: "¿Dónde conviene dormir en Esposende?"
        a: "En el centro si quieres supermercados, restaurantes y las flechas de la mañana a dos calles — lo sensato antes de una jornada de 26 km con subidas. Ofir, pasado el puente, es más agradable para la tarde y suele salir mejor de precio, pero añade un cruce de río a tu salida."
      - q: "¿Cuánto hay de Vila do Conde a Esposende?"
        a: "23,7 km con solo unos 167 m de desnivel positivo — la etapa más llana y fácil del Camino Portugués de la Costa, y casi toda por pasarela junto al Atlántico."
