i18n:
  en:
    metaTitle: "Esposende on the Coastal Camino: Services, Fort & Where to Stay"
    metaDescription: "Esposende for pilgrims on the Camino Portugués Coastal: end of the easy 23.7 km boardwalk stage, the 15th-century fort, supermarkets and lodging, and what to expect from the hard day that follows."
    h1: "Esposende"
    lead: "The end of the flattest, easiest day on the Coastal route and the start of the hardest since Porto. Esposende is a surf town at the mouth of the Cávado with more life, more shops and more beds than its size suggests — use it well, because tomorrow climbs."
    sections:
      - heading: "What you arrive to"
        body: "You cross the Rio Cávado on the metal bridge at Fão and Esposende opens on the far bank. It is a proper working town rather than a village: two large supermarkets, a full spread of restaurants, bars and cafés, and a range of hostels and guesthouses. After a day of boardwalk and beach cafés it feels almost busy."
      - heading: "The fort and the river mouth"
        body: "The Forte de São João Baptista, built in the 15th century, guards the mouth of the Cávado and gives long views up and down the coast. It is a short walk from the centre and the obvious thing to do with a spare hour. The river mouth itself is what makes the town: sheltered water on one side, open Atlantic on the other."
      - heading: "A windsurf and kitesurf town"
        body: "Esposende and the beaches around Ofir, across the river, are among the best-known windsurf and kitesurf spots in northern Portugal. That is why the seafront has more restaurants and bars than a town this size would normally carry, and why rooms can tighten in August for reasons that have nothing to do with the Camino."
      - heading: "Prepare for tomorrow"
        body: "⚠️ The stage to Viana do Castelo is 26.3 km with 503 m of ascent — three times the climbing you did today, on a route that leaves the coast and goes inland through forest. Stock up here: the villages on the way have less than you would like. Fill water, buy lunch, and start early if it is hot."
    faq:
      - q: "What does Esposende offer pilgrims?"
        a: "Two large supermarkets, plenty of restaurants, bars and cafés, a pharmacy and ATMs, and a range of hostels and guesthouses. It is the biggest town between Vila do Conde and Viana do Castelo."
      - q: "Is there anything to see in Esposende?"
        a: "The Forte de São João Baptista, a 15th-century fort guarding the mouth of the Rio Cávado, with views along the coast. Across the river, Ofir has pine woods, dunes and a wide beach popular with windsurfers and kitesurfers."
      - q: "How hard is the stage after Esposende?"
        a: "Moderate and the hardest since Porto: 26.3 km to Viana do Castelo with about 503 m of ascent, two climbs of roughly 100 m each, and a long inland section through eucalyptus forest. Stock up in Esposende before you leave."
      - q: "Where should I stay in Esposende?"
        a: "The town centre if you want the supermarkets, restaurants and the morning waymarks within a couple of streets — the sensible choice before a 26 km climbing day. Ofir, across the bridge, is nicer for an evening and often better value, but adds a river crossing to your start."
      - q: "How far is Vila do Conde to Esposende?"
        a: "23.7 km with only about 167 m of ascent — the flattest and easiest stage on the Portuguese Coastal route, and mostly on boardwalk along the Atlantic."
