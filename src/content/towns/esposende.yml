    h1: "Esposende"
    lead: "O fim do dia mais plano e fácil do Caminho da Costa e o início do mais duro desde o Porto. Esposende é uma terra de surf na foz do Cávado, com mais vida, mais lojas e mais camas do que o tamanho faz supor — aproveita bem, porque amanhã sobe."
    sections:
      - heading: "O que encontras à chegada"
        body: "Atravessas o Rio Cávado pela ponte metálica de Fão e Esposende abre-se na outra margem. É uma vila a sério, não uma aldeia: dois supermercados grandes, oferta completa de restaurantes, bares e cafés, e vários hostels e pensões. Depois de um dia de passadiço e bares de praia, quase parece movimentada."
      - heading: "O forte e a foz"
        body: "O Forte de São João Baptista, do século XV, guarda a foz do Cávado e oferece vistas longas ao longo da costa. Fica a um passeio do centro e é o plano óbvio se te sobrar uma hora. A própria foz é o que define a vila: água abrigada de um lado, Atlântico aberto do outro."
      - heading: "Terra de windsurf e kitesurf"
        body: "Esposende e as praias de Ofir, do outro lado do rio, estão entre os spots de windsurf e kitesurf mais conhecidos do norte de Portugal. É por isso que a marginal tem mais restaurantes e bares do que lhe caberia pelo tamanho, e é por isso que em agosto os quartos apertam por razões que nada têm a ver com o Caminho."
      - heading: "Prepara o dia seguinte"
        body: "⚠️ A etapa até Viana do Castelo são 26,3 km com 503 m de subida — o triplo do que subiste hoje, e por um trilho que deixa a costa e entra pelo interior entre floresta. Abastece-te aqui: as aldeias do caminho têm menos do que gostarias. Enche água, compra o almoço e sai cedo se estiver calor."
    faq:
      - q: "O que tem Esposende para o peregrino?"
        a: "Dois supermercados grandes, muitos restaurantes, bares e cafés, farmácia e multibancos, e vários hostels e pensões. É a maior vila entre Vila do Conde e Viana do Castelo."
      - q: "Há alguma coisa para ver em Esposende?"
        a: "O Forte de São João Baptista, um forte do século XV que guarda a foz do Rio Cávado, com vistas ao longo da costa. Do outro lado do rio, Ofir tem pinhais, dunas e um areal largo muito procurado por windsurfistas e kitesurfistas."
      - q: "Quão dura é a etapa a seguir a Esposende?"
        a: "Moderada e a mais dura desde o Porto: 26,3 km até Viana do Castelo com cerca de 503 m de subida, duas subidas de uns 100 m cada e um longo troço interior entre eucaliptos. Abastece-te em Esposende antes de sair."
      - q: "Onde devo dormir em Esposende?"
        a: "No centro se quiseres supermercados, restaurantes e as setas da manhã a duas ruas — o sensato antes de um dia de 26 km com subidas. Ofir, passada a ponte, é mais agradável para a tarde e costuma ter melhor preço, mas acrescenta uma travessia de rio à tua partida."
      - q: "Qual é a distância de Vila do Conde a Esposende?"
        a: "23,7 km com apenas cerca de 167 m de subida acumulada — a etapa mais plana e fácil do Caminho Português da Costa, e quase toda por passadiço junto ao Atlântico."
