i18n:
  en:
    metaTitle: "Póvoa de Varzim on the Coastal Camino: Albergue, Beaches & Where to Stay"
    metaDescription: "Póvoa de Varzim for pilgrims on the Camino Portugués Coastal: the donation albergue and its 14:00–20:00 check-in, when to stop here instead of Vila do Conde, what to see, and where to sleep."
    h1: "Póvoa de Varzim"
    lead: "Five kilometres past Vila do Conde and a completely different town: a working seaside resort with nearly 12 km of beach, a casino, and several times the bed capacity of anywhere else on this stretch. That last part is why it matters in August."
    sections:
      - heading: "When to stop here instead"
        body: "💡 Póvoa arrives about 5 km into the Vila do Conde–Esposende stage, which makes it an odd place to end a normal day and an excellent place to end a bad one. Stop here if the 28.4 km from Porto broke you, if Vila do Conde's albergue was full, or if you are walking short days deliberately. Starting here instead trims the next stage to under 19 km."
      - heading: "The albergue"
        body: "The Albergue de Peregrinos São José de Ribamar is a parish-run donation albergue in the town centre with 16 beds, open only to pilgrims carrying a credential. There are no reservations and check-in runs from 14:00 to 20:00 — arrive inside that window or you will find the door shut. Sixteen beds go quickly in summer, so have a fallback."
      - heading: "Capacity when everywhere else is full"
        body: "⚠️ This is the practical reason to know Póvoa exists. It is a mainstream Portuguese holiday resort, so it carries hotel capacity on a scale the Camino towns do not, and rooms are usually findable at short notice even in August. You will pay resort rates rather than pilgrim rates, but a bed at a price beats no bed."
      - heading: "What to see"
        body: "The Museu de Etnografia e História documents centuries of fishing life here, including the siglas poveiras — a system of geometric marks that Póvoa's fishing families used for generations to identify boats and property, and which you still see around town. About 5 km inland, the Cividade de Terroso is an Iron Age hillfort with ring walls and circular house foundations, one of the best preserved in the region."
      - heading: "Getting here and away"
        body: "Metro line B links Póvoa de Varzim to Porto, which makes it easy to join the Camino here and skip the city suburbs entirely, or to bail out if something goes wrong in the first days. Buses run along the coast, and the seafront has the full run of supermarkets, pharmacies and ATMs."
    faq:
      - q: "Is there a pilgrim albergue in Póvoa de Varzim?"
        a: "Yes — the Albergue de Peregrinos São José de Ribamar, a parish-run donation albergue in the town centre with 16 beds. It is open only to pilgrims with a credential, takes no reservations, and checks in between 14:00 and 20:00."
      - q: "How far is Póvoa de Varzim from Vila do Conde?"
        a: "About 5 km on foot along the route, roughly an hour. The two towns effectively share a seafront, and metro line B connects both to Porto."
      - q: "Should I stop in Póvoa de Varzim or push on to Esposende?"
        a: "Push on if you are walking normal days — Póvoa comes only 5 km into the stage. Stop here if the long first day from Porto hurt, if Vila do Conde was full, or if you want a short day. Starting from Póvoa cuts the stage to Esposende to under 19 km."
      - q: "Why is Póvoa de Varzim useful in August?"
        a: "It is a mainstream seaside resort with several times the bed capacity of the Camino towns around it, so rooms are usually findable at short notice when everything else is booked out. Expect resort prices rather than pilgrim prices."
      - q: "What is there to see in Póvoa de Varzim?"
        a: "The Museu de Etnografia e História and the siglas poveiras, the geometric marks the local fishing families used to identify boats and property. About 5 km inland, the Cividade de Terroso is a well-preserved Iron Age hillfort. Otherwise it is beaches, the promenade and the casino."
