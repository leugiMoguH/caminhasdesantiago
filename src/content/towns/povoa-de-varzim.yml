whereToStay:
  en:
    intro: "Póvoa is the capacity valve of this stretch. It is a full-size seaside resort with several times Vila do Conde's bed count, which makes it the answer in August or whenever the albergue 5 km back is full. It sits about 5 km into the Vila do Conde–Esposende stage, so stopping here is a short day, and starting here is a short one too."
    areas:
      - name: "Seafront & the casino"
        blurb: "The promenade is the town: hotels facing nearly 12 km of beach, restaurants behind them, and the casino anchoring the middle. This is where the capacity is and where you will find a room at short notice in high season — usually at resort prices rather than pilgrim ones."
        bookingQuery: "Póvoa de Varzim beachfront"
        anchor: "seafront hotels along Póvoa's promenade"
      - name: "Town centre"
        blurb: "A block or two back from the sand, the centre holds the donation albergue, the supermarkets and the cheaper guesthouses, and puts you on the morning waymarks without crossing town. The sensible choice if you are walking on to Esposende rather than taking a beach day."
        bookingQuery: "Póvoa de Varzim centro"
        anchor: "guesthouses in Póvoa de Varzim centre"
      - name: "Vila do Conde — 5 km back"
        blurb: "The two towns effectively share a seafront, and Vila do Conde has the convent, the aqueduct and a quieter old town. If Póvoa is full or feels too much like a resort, walking back or catching the metro one stop is a real option rather than a compromise."
        bookingQuery: "Vila do Conde centro histórico"
        anchor: "stays in Vila do Conde, 5 km back down the route"
  es:
    intro: "Póvoa es la válvula de capacidad de este tramo. Es un balneario en toda regla con varias veces las plazas de Vila do Conde, lo que la convierte en la respuesta en agosto o cuando el albergue de 5 km atrás está lleno. Queda a unos 5 km del inicio de la etapa Vila do Conde–Esposende, así que parar aquí deja un día corto, y empezar aquí también."
    areas:
      - name: "Paseo marítimo y el casino"
        blurb: "El paseo es el pueblo: hoteles frente a casi 12 km de playa, restaurantes detrás y el casino en el centro. Aquí está la capacidad y aquí encontrarás habitación a última hora en temporada alta — normalmente a precio de balneario, no de peregrino."
        bookingQuery: "Póvoa de Varzim primera línea de playa"
        anchor: "hoteles frente al mar en el paseo de Póvoa"
      - name: "Centro"
        blurb: "Una o dos manzanas hacia dentro, el centro reúne el albergue de donativo, los supermercados y las pensiones más baratas, y te deja sobre las flechas de la mañana sin cruzar el pueblo. Lo sensato si sigues hasta Esposende en vez de tomarte un día de playa."
        bookingQuery: "Póvoa de Varzim centro"
        anchor: "pensiones en el centro de Póvoa de Varzim"
      - name: "Vila do Conde — 5 km atrás"
        blurb: "Los dos pueblos comparten prácticamente el paseo marítimo, y Vila do Conde tiene el convento, el acueducto y un casco antiguo más tranquilo. Si Póvoa está llena o te resulta demasiado balneario, volver andando o una parada de metro es una opción real, no un apaño."
        bookingQuery: "Vila do Conde casco histórico"
        anchor: "alojamientos en Vila do Conde, 5 km atrás en la ruta"
  pt:
    intro: "A Póvoa é a válvula de capacidade deste troço. É uma estância balnear a sério, com várias vezes as camas de Vila do Conde, o que faz dela a resposta em agosto ou sempre que o albergue 5 km atrás está cheio. Fica a uns 5 km do início da etapa Vila do Conde–Esposende, por isso parar aqui deixa um dia curto, e começar aqui também."
    areas:
      - name: "Marginal e o casino"
        blurb: "A marginal é a vila: hotéis virados para quase 12 km de praia, restaurantes atrás e o casino a ancorar o meio. É aqui que está a capacidade e é aqui que arranjas quarto em cima da hora em época alta — normalmente a preço de estância, não de peregrino."
        bookingQuery: "Póvoa de Varzim primeira linha de praia"
        anchor: "hotéis à beira-mar na marginal da Póvoa"
      - name: "Centro"
        blurb: "Um ou dois quarteirões para dentro, o centro junta o albergue de donativo, os supermercados e as pensões mais baratas, e deixa-te em cima das setas da manhã sem atravessar a vila. O sensato se segues para Esposende em vez de fazeres um dia de praia."
        bookingQuery: "Póvoa de Varzim centro"
        anchor: "pensões no centro da Póvoa de Varzim"
      - name: "Vila do Conde — 5 km atrás"
        blurb: "As duas vilas partilham praticamente a marginal, e Vila do Conde tem o convento, o aqueduto e um centro antigo mais sossegado. Se a Póvoa estiver cheia ou te souber a estância a mais, voltar a pé ou uma paragem de metro é uma opção a sério, não um remendo."
        bookingQuery: "Vila do Conde centro histórico"
        anchor: "alojamentos em Vila do Conde, 5 km atrás no trilho"
