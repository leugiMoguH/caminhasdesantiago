      - q: "¿Paro en Póvoa de Varzim o sigo hasta Esposende?"
        a: "Sigue si haces etapas normales: Póvoa llega a solo 5 km del inicio. Para aquí si el primer día largo desde Oporto te dolió, si Vila do Conde estaba lleno o si quieres un día corto. Saliendo de Póvoa, la etapa hasta Esposende baja de 19 km."
      - q: "¿Por qué es útil Póvoa de Varzim en agosto?"
        a: "Es un balneario de masas con varias veces la capacidad de camas de los pueblos del Camino de alrededor, así que suele haber habitación a última hora cuando todo lo demás está reservado. Cuenta con precios de balneario, no de peregrino."
      - q: "¿Qué hay que ver en Póvoa de Varzim?"
        a: "El Museu de Etnografia e História y las siglas poveiras, las marcas geométricas con que las familias pescadoras identificaban barcos y propiedades. A unos 5 km hacia el interior, la Cividade de Terroso es un castro de la Edad del Hierro bien conservado. Por lo demás, playas, paseo marítimo y casino."
