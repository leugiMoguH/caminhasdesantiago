i18n:
  en:
    metaTitle: "Xacobeo 2027: Walking the Camino Portugués in the Holy Year"
    metaDescription: "The 2027 Holy Year explained for Coastal Camino pilgrims: when the Holy Door opens, how crowded it will really be, why the Portuguese Coastal route is the smart choice, and the month-by-month booking timeline."
    h1: "Xacobeo 2027: what the Holy Year means for the Coastal Camino"
    lead: "25 July 2027 falls on a Sunday, which makes 2027 a Holy Year — the first since 2021–22 and the last until 2032. The Holy Door opens on 31 December 2026 and stays open all year. Expect the busiest Camino on record. Here is what actually changes, and when you need to book."
    sections:
      - heading: "Why 2027 is a Holy Year"
        body: "A Compostelan Holy Year (Ano Xacobeo) happens whenever the Feast of Saint James, 25 July, falls on a Sunday. That lands roughly 14 times a century, in a 6-5-6-11 year cycle. The last was 2021, extended into 2022 by the Pope because of the pandemic. After 2027 the next are 2032 and 2038. On the afternoon of 31 December 2026 the Archbishop of Santiago strikes the wall sealing the Holy Door three times with a silver hammer; once it falls, the door stays open for the whole of 2027 and closes again on 31 December 2027."
      - heading: "How busy will it really be?"
        body: "⚠️ 2025 was a normal year and still set a record: 530,730 pilgrims collected a Compostela, up 6% on the 499,180 of 2024. Holy Years pull a large extra wave of first-time and Catholic pilgrims on top of that baseline, and Galicia invests heavily in the routes beforehand — restored paths, better signage, more services. Every serious operator expects 2027 to be the busiest year ever recorded. The pressure is not spread evenly: it concentrates on the last 100 km of the Camino Francés from Sarria, and on the July–September window around the Feast of Saint James."
      - heading: "Why the Coastal route is the smart 2027 choice"
        body: "💡 The Camino Portugués is already the fastest-growing family of routes — 190,334 pilgrims finished one of its two variants in 2025, split almost evenly between the Central (12.67% of all pilgrims) and the Coastal (12.14%). The Coastal has exploded: where one pilgrim passed a decade ago, 65 pass today. But it starts from a far smaller base than the Francés, has more towns with real hotels alongside the albergues, and spreads its pilgrims across a longer coastline. In a Holy Year that difference matters: you get the same Compostela, the same Holy Door, and a fraction of the queue."
      - heading: "The booking timeline that actually matters"
        body: "The single mistake that ruins a Holy Year Camino is booking on the normal schedule. Work backwards from your start date: lock the Santiago nights and your flights first (they are the hardest to change), then the last three stages into Santiago, then the rest. As a rule of thumb for 2027 — 9 to 12 months ahead for anything in July and August or the week around 25 July; 6 to 9 months for May, June and September; 3 to 6 months for April and October. Municipal albergues do not take bookings at all, so the earlier you plan, the more of your nights should be in places that do."
      - heading: "The Holy Door and the plenary indulgence"
        body: "Passing through the Holy Door — the Porta Santa on Praza da Quintana, opened only in Holy Years — is what most pilgrims come for. Catholic pilgrims who want the plenary indulgence must do four things: pass through the Holy Door, go to Confession, attend Mass and receive Communion, and pray for the Pope's intentions. Confession and Communion can be made within a couple of weeks either side of the visit. Non-Catholic and non-religious pilgrims can walk through the door freely; nobody is checked at the threshold."
      - heading: "What does not change in 2027"
        body: "⚡ The Compostela rules are the same in a Holy Year as in any other: at least the final 100 km on foot (200 km by bike), a credential, and two stamps a day. There is no special Holy Year credential and no extra paperwork. What does change is the queue at the Pilgrim's Office — use the online check-in to join the digital queue before you arrive rather than standing in Rúa das Carretas."
    faq:
      - q: "What is Xacobeo 2027?"
        a: "Xacobeo 2027 is a Compostelan Holy Year — it happens whenever 25 July, the Feast of Saint James, falls on a Sunday, which it does in 2027. The Holy Door of Santiago Cathedral opens on 31 December 2026 and stays open until 31 December 2027, and Catholic pilgrims can obtain a plenary indulgence."
      - q: "When is the next Holy Year after 2027?"
        a: "2032, then 2038. The cycle runs 6-5-6-11 years. The last Holy Year was 2021, which the Pope extended into 2022 because of the pandemic."
      - q: "Will the Camino be too crowded in 2027?"
        a: "The Camino Francés from Sarria will be very crowded, especially in July and August. The Portuguese Coastal route is far less pressured — it carried about 12% of all pilgrims in 2025 and spreads them along a much longer coastline with more hotel capacity than the Francés. Walking the Coastal route outside July and August is a comfortable Holy Year."
      - q: "How far ahead should I book accommodation for 2027?"
        a: "For July, August or the week around 25 July, book 9 to 12 months ahead. For May, June and September, 6 to 9 months. For April and October, 3 to 6 months. Book your Santiago nights and flights first — they are the hardest to change later."
      - q: "Do I need a special credential or extra paperwork for the Holy Year?"
        a: "No. The credential and the Compostela rules are identical to any other year: the final 100 km on foot or 200 km by bike, with two stamps a day. The only practical difference is a much longer queue at the Pilgrim's Office, so use the online check-in."
      - q: "How do I get the plenary indulgence in 2027?"
        a: "Pass through the Holy Door on Praza da Quintana, go to Confession, attend Mass and receive Communion, and pray for the Pope's intentions. Confession and Communion can be made within roughly two weeks before or after your visit to the cathedral."
      - q: "Can non-Catholics walk through the Holy Door?"
        a: "Yes. The Holy Door is open to everyone during the Holy Year and nobody is questioned at the threshold. The indulgence is a Catholic devotion, but the door itself is not restricted."
    howTo:
      - name: "Pick your window and avoid the crush"
        text: "Choose May, June, late September or early October if you can. Avoid the week around 25 July 2027 and the whole of August unless the Feast day itself is the point of your trip."
      - name: "Book Santiago and your flights first"
        text: "Santiago beds and flights sell out earliest and are the hardest to change. Lock your arrival and departure before touching the walking stages."
      - name: "Work backwards from Santiago"
        text: "Book the final three stages into Santiago next — Padrón, Teo and the outskirts fill first because every route converges there. Then fill in the earlier coastal stages."
      - name: "Mix bookable beds with municipal albergues"
        text: "Municipal albergues never take reservations. In a Holy Year, plan the majority of your nights in private albergues, guesthouses or hotels that do, and treat municipals as a bonus rather than a plan."
      - name: "Register the digital queue before you arrive"
        text: "Check in online for the Pilgrim's Office a day or two before you reach Santiago so you join the digital queue instead of waiting in the street."
  es:
    metaTitle: "Xacobeo 2027: hacer el Camino Portugués en el Año Santo"
    metaDescription: "El Año Santo 2027 explicado para peregrinos del Camino de la Costa: cuándo se abre la Puerta Santa, cuánta gente habrá de verdad, por qué la ruta portuguesa de la Costa es la opción inteligente y el calendario de reservas mes a mes."
    h1: "Xacobeo 2027: qué significa el Año Santo para el Camino de la Costa"
    lead: "El 25 de julio de 2027 cae en domingo, así que 2027 es Año Santo — el primero desde 2021–22 y el último hasta 2032. La Puerta Santa se abre el 31 de diciembre de 2026 y permanece abierta todo el año. Se espera el Camino más concurrido de la historia. Esto es lo que cambia de verdad, y cuándo tienes que reservar."
    sections:
      - heading: "Por qué 2027 es Año Santo"
        body: "Un Año Santo Compostelano (Ano Xacobeo) ocurre siempre que la festividad de Santiago Apóstol, el 25 de julio, cae en domingo. Eso sucede unas 14 veces por siglo, en un ciclo de 6-5-6-11 años. El último fue 2021, prorrogado a 2022 por el Papa a causa de la pandemia. Después de 2027 vienen 2032 y 2038. La tarde del 31 de diciembre de 2026 el Arzobispo de Santiago golpea tres veces con un martillo de plata el muro que sella la Puerta Santa; una vez derribado, la puerta queda abierta todo 2027 y se cierra de nuevo el 31 de diciembre de 2027."
      - heading: "¿Cuánta gente habrá realmente?"
        body: "⚠️ 2025 fue un año normal y aun así batió el récord: 530.730 peregrinos recogieron la Compostela, un 6% más que los 499.180 de 2024. Los Años Santos añaden a esa base una gran oleada de peregrinos primerizos y católicos, y Galicia invierte fuerte en las rutas antes de cada uno — caminos restaurados, mejor señalización, más servicios. Todos los operadores serios esperan que 2027 sea el año más concurrido jamás registrado. La presión no se reparte por igual: se concentra en los últimos 100 km del Camino Francés desde Sarria y en la ventana de julio a septiembre alrededor de la festividad."
      - heading: "Por qué la ruta de la Costa es la elección inteligente en 2027"
        body: "💡 El Camino Portugués ya es la familia de rutas que más crece — 190.334 peregrinos completaron una de sus dos variantes en 2025, repartidos casi a partes iguales entre el Central (12,67% del total de peregrinos) y la Costa (12,14%). La Costa se ha disparado: por donde antes pasaba un peregrino, hoy pasan 65. Pero parte de una base mucho menor que el Francés, tiene más pueblos con hoteles reales junto a los albergues y reparte a sus peregrinos por un litoral más largo. En un Año Santo esa diferencia cuenta: consigues la misma Compostela, la misma Puerta Santa y una fracción de la cola."
      - heading: "El calendario de reservas que de verdad importa"
        body: "El error que arruina un Camino en Año Santo es reservar con los plazos de siempre. Cuenta hacia atrás desde tu fecha de salida: fija primero las noches en Santiago y los vuelos (son lo más difícil de cambiar), después las tres últimas etapas hasta Santiago y por último el resto. Como regla para 2027 — de 9 a 12 meses de antelación para julio y agosto o la semana del 25 de julio; de 6 a 9 meses para mayo, junio y septiembre; de 3 a 6 meses para abril y octubre. Los albergues municipales no aceptan reservas, así que cuanto antes planifiques, más noches deberías tener en sitios que sí las aceptan."
      - heading: "La Puerta Santa y la indulgencia plenaria"
        body: "Cruzar la Puerta Santa — la Porta Santa de la Praza da Quintana, abierta solo en Años Santos — es a lo que va la mayoría. Los peregrinos católicos que quieran la indulgencia plenaria deben hacer cuatro cosas: pasar por la Puerta Santa, confesarse, asistir a Misa y comulgar, y rezar por las intenciones del Papa. La confesión y la comunión pueden hacerse en las dos semanas anteriores o posteriores a la visita. Los peregrinos no católicos y no creyentes pueden cruzar la puerta libremente; nadie comprueba nada en el umbral."
      - heading: "Lo que no cambia en 2027"
        body: "⚡ Las normas de la Compostela son las mismas en Año Santo que en cualquier otro: al menos los últimos 100 km a pie (200 km en bici), credencial y dos sellos al día. No hay credencial especial de Año Santo ni papeleo extra. Lo que sí cambia es la cola en la Oficina del Peregrino — usa el registro online para entrar en la fila digital antes de llegar, en vez de esperar en la Rúa das Carretas."
    faq:
      - q: "¿Qué es el Xacobeo 2027?"
        a: "El Xacobeo 2027 es un Año Santo Compostelano — ocurre siempre que el 25 de julio, festividad de Santiago Apóstol, cae en domingo, como sucede en 2027. La Puerta Santa de la Catedral de Santiago se abre el 31 de diciembre de 2026 y permanece abierta hasta el 31 de diciembre de 2027, y los peregrinos católicos pueden obtener la indulgencia plenaria."
      - q: "¿Cuándo es el siguiente Año Santo después de 2027?"
        a: "2032, y después 2038. El ciclo es de 6-5-6-11 años. El último Año Santo fue 2021, que el Papa prorrogó a 2022 por la pandemia."
      - q: "¿Habrá demasiada gente en el Camino en 2027?"
        a: "El Camino Francés desde Sarria estará muy concurrido, sobre todo en julio y agosto. La ruta Portuguesa de la Costa está mucho menos presionada — llevó alrededor del 12% de todos los peregrinos en 2025 y los reparte por un litoral mucho más largo, con más capacidad hotelera que el Francés. Hacer la Costa fuera de julio y agosto es un Año Santo cómodo."
      - q: "¿Con cuánta antelación debo reservar alojamiento para 2027?"
        a: "Para julio, agosto o la semana del 25 de julio, entre 9 y 12 meses antes. Para mayo, junio y septiembre, entre 6 y 9 meses. Para abril y octubre, entre 3 y 6 meses. Reserva primero las noches en Santiago y los vuelos: son lo más difícil de cambiar después."
      - q: "¿Necesito una credencial especial o papeleo extra para el Año Santo?"
        a: "No. La credencial y las normas de la Compostela son idénticas a cualquier otro año: los últimos 100 km a pie o 200 km en bici, con dos sellos al día. La única diferencia práctica es una cola mucho más larga en la Oficina del Peregrino, así que usa el registro online."
      - q: "¿Cómo consigo la indulgencia plenaria en 2027?"
        a: "Pasa por la Puerta Santa de la Praza da Quintana, confiésate, asiste a Misa y comulga, y reza por las intenciones del Papa. La confesión y la comunión pueden hacerse aproximadamente en las dos semanas anteriores o posteriores a tu visita a la catedral."
      - q: "¿Pueden los no católicos cruzar la Puerta Santa?"
        a: "Sí. La Puerta Santa está abierta a todo el mundo durante el Año Santo y nadie pregunta nada en el umbral. La indulgencia es una devoción católica, pero la puerta en sí no está restringida."
    howTo:
      - name: "Elige tu ventana y evita la avalancha"
        text: "Escoge mayo, junio, finales de septiembre o principios de octubre si puedes. Evita la semana del 25 de julio de 2027 y todo agosto, salvo que la festividad sea justamente el motivo de tu viaje."
      - name: "Reserva primero Santiago y los vuelos"
        text: "Las camas en Santiago y los vuelos se agotan antes y son lo más difícil de cambiar. Fija llegada y salida antes de tocar las etapas."
      - name: "Planifica hacia atrás desde Santiago"
        text: "Reserva después las tres últimas etapas hasta Santiago — Padrón, Teo y las afueras se llenan primero porque todas las rutas convergen ahí. Luego completa las etapas costeras anteriores."
      - name: "Combina camas reservables con albergues municipales"
        text: "Los albergues municipales nunca aceptan reservas. En Año Santo, planifica la mayoría de las noches en albergues privados, pensiones u hoteles que sí las acepten, y trata los municipales como un extra, no como un plan."
      - name: "Entra en la fila digital antes de llegar"
        text: "Regístrate online en la Oficina del Peregrino uno o dos días antes de llegar a Santiago para entrar en la fila digital en vez de esperar en la calle."
  pt:
    metaTitle: "Xacobeo 2027: fazer o Caminho Português no Ano Santo"
    metaDescription: "O Ano Santo 2027 explicado para peregrinos do Caminho da Costa: quando abre a Porta Santa, quanta gente haverá de facto, porque é que a rota portuguesa da Costa é a escolha inteligente e o calendário de reservas mês a mês."
    h1: "Xacobeo 2027: o que o Ano Santo significa para o Caminho da Costa"
    lead: "25 de julho de 2027 cai a um domingo, o que faz de 2027 um Ano Santo — o primeiro desde 2021–22 e o último até 2032. A Porta Santa abre a 31 de dezembro de 2026 e fica aberta o ano inteiro. Espera-se o Caminho mais concorrido de sempre. Isto é o que muda mesmo, e quando tens de reservar."
    sections:
      - heading: "Porque é que 2027 é Ano Santo"
        body: "Um Ano Santo Compostelano (Ano Xacobeo) acontece sempre que a festa de Santiago Maior, 25 de julho, cai a um domingo. Isso sucede cerca de 14 vezes por século, num ciclo de 6-5-6-11 anos. O último foi 2021, prolongado até 2022 pelo Papa devido à pandemia. Depois de 2027 seguem-se 2032 e 2038. Na tarde de 31 de dezembro de 2026 o Arcebispo de Santiago bate três vezes com um martelo de prata no muro que sela a Porta Santa; assim que este cai, a porta fica aberta durante todo o ano de 2027 e volta a fechar a 31 de dezembro de 2027."
      - heading: "Quanta gente haverá realmente?"
        body: "⚠️ 2025 foi um ano normal e ainda assim bateu o recorde: 530.730 peregrinos receberam a Compostela, mais 6% do que os 499.180 de 2024. Os Anos Santos acrescentam a essa base uma grande vaga de peregrinos de primeira viagem e de católicos, e a Galiza investe fortemente nas rotas antes de cada um — caminhos restaurados, melhor sinalização, mais serviços. Todos os operadores sérios esperam que 2027 seja o ano mais concorrido alguma vez registado. A pressão não se distribui por igual: concentra-se nos últimos 100 km do Caminho Francês a partir de Sarria e na janela de julho a setembro em torno da festa."
      - heading: "Porque é que a rota da Costa é a escolha inteligente em 2027"
        body: "💡 O Caminho Português já é a família de rotas que mais cresce — 190.334 peregrinos completaram uma das suas duas variantes em 2025, repartidos quase por igual entre o Central (12,67% de todos os peregrinos) e a Costa (12,14%). A Costa disparou: por onde antes passava um peregrino, passam hoje 65. Mas parte de uma base muito menor do que o Francês, tem mais localidades com hotéis a sério ao lado dos albergues e distribui os peregrinos por um litoral mais longo. Num Ano Santo essa diferença conta: recebes a mesma Compostela, a mesma Porta Santa e uma fração da fila."
      - heading: "O calendário de reservas que interessa mesmo"
        body: "O erro que estraga um Caminho em Ano Santo é reservar com os prazos do costume. Conta para trás a partir da data de partida: fixa primeiro as noites em Santiago e os voos (são o mais difícil de mudar), depois as três últimas etapas até Santiago e só então o resto. Como regra para 2027 — 9 a 12 meses de antecedência para julho e agosto ou a semana de 25 de julho; 6 a 9 meses para maio, junho e setembro; 3 a 6 meses para abril e outubro. Os albergues municipais não aceitam reservas, por isso quanto mais cedo planeares, mais noites deves ter em sítios que aceitem."
      - heading: "A Porta Santa e a indulgência plenária"
        body: "Atravessar a Porta Santa — a Porta Santa da Praza da Quintana, aberta apenas em Anos Santos — é o que traz a maioria. Os peregrinos católicos que queiram a indulgência plenária têm de fazer quatro coisas: passar pela Porta Santa, confessar-se, assistir à Missa e comungar, e rezar pelas intenções do Papa. A confissão e a comunhão podem ser feitas nas duas semanas antes ou depois da visita. Peregrinos não católicos e não crentes podem atravessar a porta livremente; ninguém é verificado à entrada."
      - heading: "O que não muda em 2027"
        body: "⚡ As regras da Compostela são as mesmas num Ano Santo e em qualquer outro: pelo menos os últimos 100 km a pé (200 km de bicicleta), credencial e dois carimbos por dia. Não há credencial especial de Ano Santo nem papelada extra. O que muda é a fila na Oficina do Peregrino — usa o registo online para entrar na fila digital antes de chegares, em vez de esperares na Rúa das Carretas."
    faq:
      - q: "O que é o Xacobeo 2027?"
        a: "O Xacobeo 2027 é um Ano Santo Compostelano — acontece sempre que 25 de julho, festa de Santiago Maior, cai a um domingo, como sucede em 2027. A Porta Santa da Catedral de Santiago abre a 31 de dezembro de 2026 e fica aberta até 31 de dezembro de 2027, e os peregrinos católicos podem obter a indulgência plenária."
      - q: "Quando é o próximo Ano Santo depois de 2027?"
        a: "2032 e depois 2038. O ciclo é de 6-5-6-11 anos. O último Ano Santo foi 2021, que o Papa prolongou até 2022 por causa da pandemia."
      - q: "O Caminho vai estar cheio de mais em 2027?"
        a: "O Caminho Francês a partir de Sarria vai estar muito concorrido, sobretudo em julho e agosto. A rota Portuguesa da Costa está bastante menos pressionada — levou cerca de 12% de todos os peregrinos em 2025 e distribui-os por um litoral muito mais longo, com mais capacidade hoteleira do que o Francês. Fazer a Costa fora de julho e agosto é um Ano Santo confortável."
      - q: "Com quanta antecedência devo reservar alojamento para 2027?"
        a: "Para julho, agosto ou a semana de 25 de julho, 9 a 12 meses antes. Para maio, junho e setembro, 6 a 9 meses. Para abril e outubro, 3 a 6 meses. Reserva primeiro as noites em Santiago e os voos: são o mais difícil de mudar depois."
      - q: "Preciso de uma credencial especial ou papelada extra para o Ano Santo?"
        a: "Não. A credencial e as regras da Compostela são idênticas às de qualquer outro ano: os últimos 100 km a pé ou 200 km de bicicleta, com dois carimbos por dia. A única diferença prática é uma fila muito maior na Oficina do Peregrino, por isso usa o registo online."
      - q: "Como obtenho a indulgência plenária em 2027?"
        a: "Passa pela Porta Santa na Praza da Quintana, confessa-te, assiste à Missa e comunga, e reza pelas intenções do Papa. A confissão e a comunhão podem ser feitas nas duas semanas antes ou depois da tua visita à catedral."
      - q: "Os não católicos podem atravessar a Porta Santa?"
        a: "Sim. A Porta Santa está aberta a toda a gente durante o Ano Santo e ninguém é questionado à entrada. A indulgência é uma devoção católica, mas a porta em si não é restrita."
    howTo:
      - name: "Escolhe a tua janela e evita a enchente"
        text: "Escolhe maio, junho, final de setembro ou início de outubro se puderes. Evita a semana de 25 de julho de 2027 e agosto inteiro, a menos que a própria festa seja o motivo da viagem."
      - name: "Reserva primeiro Santiago e os voos"
        text: "As camas em Santiago e os voos esgotam mais cedo e são o mais difícil de mudar. Fixa chegada e partida antes de tocar nas etapas."
      - name: "Planeia de trás para a frente a partir de Santiago"
        text: "Reserva a seguir as três últimas etapas até Santiago — Padrón, Teo e os arredores enchem primeiro porque todas as rotas convergem ali. Depois preenche as etapas costeiras anteriores."
      - name: "Combina camas reserváveis com albergues municipais"
        text: "Os albergues municipais nunca aceitam reservas. Num Ano Santo, planeia a maioria das noites em albergues privados, pensões ou hotéis que aceitem, e trata os municipais como um extra, não como um plano."
      - name: "Entra na fila digital antes de chegares"
        text: "Faz o registo online na Oficina do Peregrino um ou dois dias antes de chegares a Santiago para entrares na fila digital em vez de esperares na rua."
